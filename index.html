        else if (c === '{') depth++;
        else if (c === '}') { depth--; if (depth === 0) { end = i; break; } }
      }
      if (end === -1) throw new Error('That JSON looks cut off — the braces don\'t balance. Copy Claude\'s full reply.');
      try { obj = JSON.parse(t.slice(start, end + 1)); }
      catch (e2) { throw new Error('Couldn\'t read the JSON (' + e2.message + '). Make sure you copied all of Claude\'s reply.'); }
    }
    var rub = obj && obj.rubric ? obj.rubric : obj;
    if (!rub || typeof rub !== 'object' || !Array.isArray(rub.dimensions) || !rub.dimensions.length) {
      throw new Error('That doesn\'t look like a rubric — no dimensions found. Re-run the prompt and paste Claude\'s whole reply.');
    }
    var first = rub.dimensions[0];
    var levelCount = Number.isInteger(rub.levelCount) ? rub.levelCount : (first && Array.isArray(first.levels) ? first.levels.length : 4);
    var labels = (Array.isArray(rub.levelLabels) && rub.levelLabels.length) ? rub.levelLabels.slice()
      : (first && Array.isArray(first.levels) ? first.levels.map(function (l) { return (l && l.label) || ''; }) : []);
    var seen = {};
    return {
      id: (rub.id && /^rub_/.test(rub.id)) ? rub.id : uid('rub'),
      name: String(rub.name || 'Custom rubric').trim() || 'Custom rubric',
      version: 1,
      levelCount: levelCount,
      levelLabels: labels,
      dimensions: rub.dimensions.map(function (d, di) {
        d = d || {};
        var id = (d.id && /^dim_/.test(d.id)) ? d.id : slugify(d.name);
        if (seen[id]) id = id + '_' + (di + 1);
        seen[id] = true;
        var levels = (Array.isArray(d.levels) ? d.levels : []).map(function (l, li) {
          l = l || {};
          return { level: li + 1, label: String(l.label || labels[li] || ('Level ' + (li + 1))), descriptor: String(l.descriptor || l.description || '').trim() };
        });
        var dim = { id: id, name: String(d.name || '').trim(), description: String(d.description || d.summary || '').trim(), levels: levels };
        /* optional clarifying question shown at the note field (spec: dimension.notePrompt) */
        if (d.notePrompt && String(d.notePrompt).trim()) dim.notePrompt = String(d.notePrompt).trim();
        return dim;
      })
    };
  }

  function subjectKeyOf(a) {
    return String(a.rubricId || '') + '::' + String(a.subject && a.subject.firstName || '').trim().toLowerCase();
  }

  function pairUp(assessments) {
    var map = new Map();
    (assessments || []).forEach(function (a, i) {
      if (!a || !a.subject || blank(a.subject.firstName)) return;
      var slot = a.raterType === 'manager' ? 'manager' : (a.raterType === 'self' ? 'self' : null);
      if (!slot) return;
      var k = subjectKeyOf(a);
      if (!map.has(k)) map.set(k, { key: k, firstName: String(a.subject.firstName).trim(), rubricId: a.rubricId, self: null, manager: null, _si: -1, _mi: -1 });
      var p = map.get(k);
      var idxKey = slot === 'self' ? '_si' : '_mi';
      var cur = p[slot];
      var newer = !cur ||
        String(a.date || '') > String(cur.date || '') ||
        (String(a.date || '') === String(cur.date || '') && i > p[idxKey]);
      if (newer) { p[slot] = a; p[idxKey] = i; }
    });
    return Array.from(map.values()).map(function (p) { delete p._si; delete p._mi; return p; });
  }

  /* Drop draft ratings that no longer fit the rubric (dimension removed,
     level count shrunk). Keeps notes; a now-invalid level resets to null
     so the rater re-picks instead of being blocked by an invisible error.
     The draft's original rubricVersion is preserved on purpose: surviving
     levels were picked against the old wording, and that is exactly what
     the version-mismatch notice exists to surface. */
  function reconcileDraft(assessment, rubric) {
    var known = {};
    (rubric.dimensions || []).forEach(function (d) { known[d.id] = true; });
    var out = JSON.parse(JSON.stringify(assessment));
    out.ratings = (out.ratings || []).filter(function (r) {
      if (!r || !known[r.dimensionId]) return false;
      if (r.level != null && (!Number.isInteger(r.level) || r.level < 1 || r.level > rubric.levelCount)) r.level = null;
      return true;
    });
    return out;
  }

  /* Pick the right self/manager pair for a person when several rubrics have
     ratings: prefer the active rubric's pair, else the most recent one. */
  function pickPair(assessments, firstName, activeRubricId) {
    var k = String(firstName || '').trim().toLowerCase();
    var candidates = pairUp(assessments).filter(function (p) { return p.firstName.toLowerCase() === k; });
    if (!candidates.length) return null;
    for (var i = 0; i < candidates.length; i++) {
      if (activeRubricId && candidates[i].rubricId === activeRubricId) return candidates[i];
    }
    function latest(p) {
      var m = '';
      [p.self, p.manager].forEach(function (a) { if (a && String(a.date || '') > m) m = String(a.date); });
      return m;
    }
    candidates.sort(function (a, b) { return latest(b) > latest(a) ? 1 : (latest(b) < latest(a) ? -1 : 0); });
    return candidates[0];
  }

  /* Manager Home summary: per-person status + at-a-glance gap signal, plus
     team-level stats. Anti-anchoring safe — a gap is only computed when BOTH
     sides are in (status 'ready'), so no self level ever leaks before the
     manager has rated. */
  /* Up to 3 "what needs attention" pills per ready person:
     biggest self-vs-manager GAPS first (the conversations), then fill with the
     LOWEST manager-rated dimensions; only when there are no gaps or lows at all
     do we surface STRENGTHS ("good things"). Green is the delta, so only gap
     pills read green — low/strength pills are neutral on purpose. */
  function attentionPills(dims, sById, mById, levelCount) {
    var lvc = levelCount || 4;
    var lowThresh = Math.ceil(lvc / 2);       /* 4 levels → "low" is 1–2 */
    var strengthThresh = lvc - 1;             /* 4 levels → "strong" is 3–4 */
    var cands = (dims || []).map(function (d) {
      var s = sById[d.id], m = mById[d.id];
      var abs = (Number.isInteger(s) && Number.isInteger(m)) ? Math.abs(s - m) : null;
      return { id: d.id, name: d.name, abs: abs, m: Number.isInteger(m) ? m : null };
    });
    var pills = [], used = {};
    cands.filter(function (c) { return c.abs != null && c.abs >= 2; })
      .sort(function (a, b) { return b.abs - a.abs; })
      .forEach(function (c) { if (pills.length < 3) { pills.push({ name: c.name, type: 'gap', value: c.abs }); used[c.id] = 1; } });
    if (pills.length < 3) {
      cands.filter(function (c) { return !used[c.id] && c.m != null && c.m <= lowThresh; })
        .sort(function (a, b) { return a.m - b.m; })
        .forEach(function (c) { if (pills.length < 3) { pills.push({ name: c.name, type: 'low', value: c.m }); used[c.id] = 1; } });
    }
    if (pills.length === 0) {
      cands.filter(function (c) { return c.m != null && c.m >= strengthThresh; })
        .sort(function (a, b) { return b.m - a.m; })
        .slice(0, 3)
        .forEach(function (c) { pills.push({ name: c.name, type: 'strength', value: c.m }); });
      if (pills.length === 0) {
        var best = cands.filter(function (c) { return c.m != null; }).sort(function (a, b) { return b.m - a.m; })[0];
        if (best) pills.push({ name: best.name, type: 'strength', value: best.m });
      }
    }
    return pills;
  }

  function dashSummary(people, assessments, rubric, activeRubricId) {
    var dims = (rubric && rubric.dimensions) || [];
    var maxGap = Math.max(1, ((rubric && rubric.levelCount) || 4) - 1);
    var rows = (people || []).map(function (p) {
      var pair = pickPair(assessments, p.firstName, activeRubricId);
      var hasSelf = !!(pair && pair.self), hasMgr = !!(pair && pair.manager);
      var status = (hasSelf && hasMgr) ? 'ready' : (hasMgr ? 'awaiting-self' : (hasSelf ? 'awaiting-you' : 'new'));
      var gaps = [], talk = 0, pills = [];
      if (status === 'ready') {
        var sById = {}, mById = {};
        pair.self.ratings.forEach(function (r) { sById[r.dimensionId] = r.level; });
        pair.manager.ratings.forEach(function (r) { mById[r.dimensionId] = r.level; });
        gaps = dims.map(function (d) {
          var s = sById[d.id], m = mById[d.id];
          var abs = (Number.isInteger(s) && Number.isInteger(m)) ? Math.abs(s - m) : null;
          if (abs != null && abs >= 2) talk++;
          return { dimensionId: d.id, abs: abs, pct: abs == null ? 0 : Math.round(abs / maxGap * 100) };
        });
        pills = attentionPills(dims, sById, mById, (rubric && rubric.levelCount) || 4);
      }
      return { firstName: p.firstName, status: status, gaps: gaps, talkCount: talk, pills: pills };
    });
    return {
      rows: rows,
      stats: {
        team: rows.length,
        ready: rows.filter(function (r) { return r.status === 'ready'; }).length,
        awaitingSelf: rows.filter(function (r) { return r.status === 'awaiting-self'; }).length,
        talk: rows.reduce(function (n, r) { return n + r.talkCount; }, 0)
      }
    };
  }

  /* ---------- Home redesign aggregations (team chart, squad table, person heatmap) ----------
     Anti-anchoring safe: a person only contributes once BOTH sides are in (a "ready"
     pair), so no sealed self-rating ever leaks into a team or squad average. Scoped
     STRICTLY to the active rubric (p.rubricId === id): under multi-role the chart and
     squad table read only the active rubric's cohort, and people on other rubrics drop
     out. (setupProgress below is deliberately LENIENT by contrast — it counts any rating
     via pickPair — because onboarding asks "did you rate them", not "on which rubric".
     A fuller multi-role Home that reconciles the two is a planned later pass.) */
  function readyPairs(assessments, activeRubricId) {
    return pairUp(assessments).filter(function (p) {
      return p.self && p.manager && (!activeRubricId || p.rubricId === activeRubricId);
    });
  }
  function levelMapOf(assessment) {
    var m = {};
    ((assessment && assessment.ratings) || []).forEach(function (r) {
      if (Number.isInteger(r.level)) m[r.dimensionId] = r.level;
    });
    return m;
  }
  function avgOrNull(arr) {
    return arr.length ? arr.reduce(function (a, b) { return a + b; }, 0) / arr.length : null;
  }

  /* (a) Team skills: average self-rating vs average manager-rating per dimension,
     over ready people on the active rubric. self/manager are null when no one is ready. */
  function teamSkillSeries(assessments, rubric, activeRubricId) {
    var maps = readyPairs(assessments, activeRubricId).map(function (p) {
      return { s: levelMapOf(p.self), m: levelMapOf(p.manager) };
    });
    return ((rubric && rubric.dimensions) || []).map(function (d) {
      var selfs = [], mgrs = [], n = 0;
      maps.forEach(function (mp) {
        var hasS = Number.isInteger(mp.s[d.id]), hasM = Number.isInteger(mp.m[d.id]);
        if (hasS) selfs.push(mp.s[d.id]);
        if (hasM) mgrs.push(mp.m[d.id]);
        if (hasS || hasM) n++;
      });
      return { dimensionId: d.id, name: d.name, self: avgOrNull(selfs), manager: avgOrNull(mgrs), n: n };
    });
  }

  /* (b) Skills by squad: per squad x dimension, the average of all self AND manager
     levels (pooled) over ready members; plus an Overall column and an Unassigned row. */
  function squadSkillTable(people, squads, assessments, rubric, activeRubricId) {
    var dims = (rubric && rubric.dimensions) || [];
    var ready = {};
    readyPairs(assessments, activeRubricId).forEach(function (p) {
      ready[p.firstName.toLowerCase()] = { s: levelMapOf(p.self), m: levelMapOf(p.manager) };
    });
    function rowFor(members) {
      var cells = dims.map(function (d) {
        var vals = [];
        members.forEach(function (name) {
          var rp = ready[String(name || '').toLowerCase()];
          if (!rp) return;
          if (Number.isInteger(rp.s[d.id])) vals.push(rp.s[d.id]);
          if (Number.isInteger(rp.m[d.id])) vals.push(rp.m[d.id]);
        });
        return avgOrNull(vals);
      });
      var all = [];
      members.forEach(function (name) {
        var rp = ready[String(name || '').toLowerCase()];
        if (!rp) return;
        dims.forEach(function (d) {
          if (Number.isInteger(rp.s[d.id])) all.push(rp.s[d.id]);
          if (Number.isInteger(rp.m[d.id])) all.push(rp.m[d.id]);
        });
      });
      return { cells: cells, overall: avgOrNull(all) };
    }
    var rows = (squads || []).map(function (sq) {
      var members = sq.memberFirstNames || [];
      var r = rowFor(members);
      return { squadId: sq.id, name: sq.name, count: members.length, cells: r.cells, overall: r.overall };
    });
    var assigned = {};
    (squads || []).forEach(function (sq) {
      (sq.memberFirstNames || []).forEach(function (n) { assigned[String(n || '').toLowerCase()] = true; });
    });
    var unassigned = (people || []).filter(function (p) { return !assigned[p.firstName.toLowerCase()]; })
      .map(function (p) { return p.firstName; });
    if (unassigned.length) {
      var ur = rowFor(unassigned);
      rows.push({ squadId: null, name: 'Unassigned', count: unassigned.length, cells: ur.cells, overall: ur.overall });
    }
    return { columns: dims.map(function (d) { return { dimensionId: d.id, name: d.name }; }), rows: rows };
  }

  /* (c) Person detail: self vs manager level per dimension — only when the pair is
     ready (manager has rated), so a sealed self-rating is never exposed. */
  function personSkillMatrix(assessments, firstName, rubric, activeRubricId) {
    var pair = pickPair(assessments, firstName, activeRubricId);
    var ready = !!(pair && pair.self && pair.manager);
    var s = ready ? levelMapOf(pair.self) : {}, m = ready ? levelMapOf(pair.manager) : {};
    var dimensions = ((rubric && rubric.dimensions) || []).map(function (d) {
      return {
        dimensionId: d.id,
        name: d.name,
        self: ready && Number.isInteger(s[d.id]) ? s[d.id] : null,
        manager: ready && Number.isInteger(m[d.id]) ? m[d.id] : null
      };
    });
    return { ready: ready, dimensions: dimensions };
  }

  /* Onboarding progress: which setup stages are done, derived from live state. Squads
     is optional (skippable). rate/self require at least one person, so they never read
     as vacuously complete on a blank account. next = incomplete stages, in order. */
  function setupProgress(state, activeRubricId) {
    var st = state || {};
    var people = st.people || [], assessments = st.assessments || [];
    var hasPeople = people.length >= 1;
    /* Lenient on purpose (see readyPairs): pickPair falls back to a person's most-recent
       rating, so a teammate rated against a different rubric still counts as "rated" here,
       even though the team chart/squad table (strict) would exclude them. */
    function everyone(side) {
      return hasPeople && people.every(function (p) {
        var pair = pickPair(assessments, p.firstName, activeRubricId);
        return !!(pair && pair[side]);
      });
    }
    var stages = [
      { key: 'people', label: 'Add your team',      optional: false, done: hasPeople },
      { key: 'squads', label: 'Build squads',       optional: true,  done: (st.squads || []).length >= 1 },
      { key: 'rubric', label: 'Create your rubric', optional: false, done: (st.rubrics || []).length >= 1 },
      { key: 'survey', label: 'Send the survey',    optional: false, done: (st.surveyRounds || []).length >= 1 },
      { key: 'rate',   label: 'Rate each teammate', optional: false, done: everyone('manager') },
      { key: 'self',   label: 'Import self-ratings', optional: false, done: everyone('self') }
    ];
    return {
      stages: stages,
      total: stages.length,
      doneCount: stages.filter(function (s) { return s.done; }).length,
      allDone: stages.filter(function (s) { return !s.optional; }).every(function (s) { return s.done; }),
      next: stages.filter(function (s) { return !s.done; })
    };
  }

  /* What "the rubric changed" means for versioning: the content people are
     rated against (dimensions, levels, descriptors) — NOT the rubric's name. */
  function rubricContentFingerprint(rubric) {
    return JSON.stringify({
      levelCount: rubric.levelCount,
      dimensions: (rubric.dimensions || []).map(function (d) {
        return { id: d.id, name: d.name, description: d.description, levels: d.levels };
      })
    });
  }

  function gapInfo(selfLevel, mgrLevel) {
    if (!Number.isInteger(selfLevel) || !Number.isInteger(mgrLevel)) {
      return { abs: null, direction: null, label: 'Incomplete' };
    }
    var d = selfLevel - mgrLevel, abs = Math.abs(d);
    return {
      abs: abs,
      direction: d > 0 ? 'self-higher' : (d < 0 ? 'manager-higher' : 'aligned'),
      label: abs === 0 ? 'Aligned' : abs + '-level gap'
    };
  }

  /* Johari-style reframe of a gap: a difference is a conversation type, not a
     score. self-higher = they rate it above you (a possible blind spot to
     calibrate); manager-higher = you rate it above them (a strength they may
     be underselling). Kind/label/hint are non-judgmental on purpose. */
  function gapMeaning(g) {
    if (!g || g.abs == null) return { kind: 'incomplete', label: 'Incomplete', hint: '' };
    if (g.abs === 0) return { kind: 'aligned', label: 'Aligned', hint: 'You both see this the same.' };
    if (g.direction === 'self-higher') return { kind: 'blindspot', label: 'Possible blind spot', hint: 'They rate this higher than you do.' };
    return { kind: 'hidden', label: 'Hidden strength', hint: 'You rate this higher than they do — they may be underselling it.' };
  }

  function pctForLevel(level, levelCount) {
    return (level - 0.5) / levelCount * 100;
  }

  /* Endpoint mapping for the signature gap track: level 1 sits at the far
     left (0%), the top level at the far right (100%), so the hairline track
     reads against its end labels. */
  function pctForLevelEdge(level, levelCount) {
    if (levelCount <= 1) return 50;
    return (level - 1) / (levelCount - 1) * 100;
  }

  function uid(prefix) {
    return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function todayISO() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function buildShareSeed(rubric, firstName, managerName, message) {
    return {
      mode: 'share',
      rubric: rubric,
      request: {
        shareId: uid('shr'),
        subject: { firstName: String(firstName || '').trim() },
        managerName: String(managerName || '').trim(),
        message: String(message || '').trim()
      },
      completedAssessment: null
    };
  }

  function buildDemoData(rubric) {
    var L = rubric.levelCount;
    var clamp = function (v) { return Math.max(1, Math.min(L, v)); };
    var date = todayISO();
    var profiles = [
      { firstName: 'Maya',   self: function (i) { return clamp(2 + (i % 2)); }, mgr: function (i) { return clamp(2 + (i % 2) + (i === 2 ? 1 : 0)); } },
      { firstName: 'Jordan', self: function (i) { return clamp(3 + (i % 2)); }, mgr: function (i) { return clamp(1 + (i % 2)); } },
      { firstName: 'Priya',  self: function (i) { return clamp(1 + (i % 2)); }, mgr: function (i) { return clamp(2 + (i % 2)); } }
    ];
    var notes = {
      'Jordan|self|0': 'I ran this end to end this half and feel strong here.',
      'Jordan|manager|0': 'Good output — the gap for me is pulling others in earlier.',
      'Maya|manager|2': 'Quietly became the person the team checks direction with.'
    };
    var people = [], assessments = [];
    profiles.forEach(function (p) {
      people.push({ firstName: p.firstName, demo: true });
      ['self', 'manager'].forEach(function (rt) {
        assessments.push({
          id: 'asm_demo_' + p.firstName.toLowerCase() + '_' + rt,
          rubricId: rubric.id,
          rubricVersion: rubric.version,
          subject: { firstName: p.firstName },
          raterType: rt,
          raterName: rt === 'manager' ? 'You' : '',
          date: date,
          ratings: rubric.dimensions.map(function (d, i) {
            return {
              dimensionId: d.id,
              level: rt === 'self' ? p.self(i) : p.mgr(i),
              note: notes[p.firstName + '|' + rt + '|' + i] || ''
            };
          })
        });
      });
    });
    return { people: people, assessments: assessments };
  }

  /* ---------- score-over-time (H2) ----------
     History is a read-side aggregation over the flat, append-only assessment
     store. The latest round per (person, rater, rubric) is exactly what
     pairUp/pickPair surface, so these readers never change latest-wins —
     they expose the rounds behind it. A person rated once = history length 1. */
  function assessmentHistory(assessments, firstName, raterType, rubricId) {
    var k = String(firstName == null ? '' : firstName).trim().toLowerCase();
    var byDate = {};
    (assessments || []).forEach(function (a, i) {
      if (!a || !a.subject) return;
      if (String(a.subject.firstName == null ? '' : a.subject.firstName).trim().toLowerCase() !== k) return;
      if (a.raterType !== raterType) return;
      if (rubricId != null && a.rubricId !== rubricId) return;
      var d = String(a.date || '');
      var cur = byDate[d];
      /* one round per date: a same-day re-rate replaces the earlier one
         (later insertion wins, matching pairUp's tie-break) */
      if (!cur || i > cur.i) byDate[d] = { a: a, i: i };
    });
    return Object.keys(byDate).map(function (d) { return byDate[d]; })
      .sort(function (x, y) {
        var dx = String(x.a.date || ''), dy = String(y.a.date || '');
        return dx < dy ? -1 : (dx > dy ? 1 : x.i - y.i);
      })
      .map(function (o) { return o.a; });
  }

  /* Shape the trend for the Results screen: an overall average-level line per
     side, plus a per-dimension self/manager series, over a shared date axis.
     `show` is true only when one side has 2+ rounds — a single self + single
     manager round is just the current gap, already drawn by the ladder. */
  function buildTrend(assessments, firstName, rubric) {
    var rubricId = rubric && rubric.id;
    var dims = (rubric && rubric.dimensions) || [];
    var selfHist = assessmentHistory(assessments, firstName, 'self', rubricId);
    var mgrHist = assessmentHistory(assessments, firstName, 'manager', rubricId);
    function levelMap(a) {
      var m = {};
      (a.ratings || []).forEach(function (r) { if (r && Number.isInteger(r.level)) m[r.dimensionId] = r.level; });
      return m;
    }
    function overallSeries(hist) {
      return hist.map(function (a) {
        var lm = levelMap(a), sum = 0, n = 0;
        dims.forEach(function (d) { var lv = lm[d.id]; if (Number.isInteger(lv)) { sum += lv; n++; } });
        return { date: String(a.date || ''), avg: n ? sum / n : null, count: n };
      });
    }
    var selfLM = selfHist.map(function (a) { return { date: String(a.date || ''), lm: levelMap(a) }; });
    var mgrLM = mgrHist.map(function (a) { return { date: String(a.date || ''), lm: levelMap(a) }; });
    function dimPoints(lmList, dimId) {
      return lmList.map(function (o) {
        return { date: o.date, level: Number.isInteger(o.lm[dimId]) ? o.lm[dimId] : null };
      });
    }
    var datesSet = {};
    selfLM.concat(mgrLM).forEach(function (o) { datesSet[o.date] = true; });
    return {
      show: selfHist.length >= 2 || mgrHist.length >= 2,
      levelCount: (rubric && rubric.levelCount) || 4,
      dates: Object.keys(datesSet).sort(),
      rounds: { self: selfHist.length, manager: mgrHist.length },
      overall: { self: overallSeries(selfHist), manager: overallSeries(mgrHist) },
      byDimension: dims.map(function (d) {
        return { dimensionId: d.id, name: d.name, self: dimPoints(selfLM, d.id), manager: dimPoints(mgrLM, d.id) };
      })
    };
  }

  /* Storage migration for the history era. The flat store is already the
     source of truth, so this is a NON-destructive normalize: it keeps every
     distinct round (append-only), defaults missing fields, drops junk, and
     collapses only exact-duplicate ids (a round re-imported from the same
     file) so a round is never double-counted on the trend. Idempotent —
     safe to run on every boot. */
  function migrateAssessments(list) {
    if (!Array.isArray(list)) return [];
    var idx = {}, out = [];
    list.forEach(function (a) {
      if (!a || typeof a !== 'object' || !a.subject || typeof a.subject !== 'object') return;
      var b = {};
      for (var key in a) if (Object.prototype.hasOwnProperty.call(a, key)) b[key] = a[key];
      if (!b.id) b.id = uid('asm');
      if (typeof b.date !== 'string') b.date = '';
      if (!Array.isArray(b.ratings)) b.ratings = [];
      if (typeof b.subject.firstName !== 'string') {
        b.subject = { firstName: String(b.subject.firstName == null ? '' : b.subject.firstName) };
      }
      if (Object.prototype.hasOwnProperty.call(idx, b.id)) out[idx[b.id]] = b; /* same id: later wins */

  }

  /* ---------- surveys (Caliber Pulse) ----------
     A survey is a team-sentiment pulse: scale + text questions, sent to the
     whole team, answers POOLED anonymously. The privacy model lives here:
     receipts (identity) and ballots (answers) are kept apart and share only a
     roundId — they are never joined. Ballots carry no name and no timestamp,
     are deduped on ballotId (never on responderId), and are inserted at a
     random position so order is not a tell. See SURVEYS_PULSE_SPEC. */
  function validateSurvey(s) {
    var errors = [];
    if (!s || typeof s !== 'object') return ['No survey found.'];
    if (blank(s.name)) errors.push('The survey needs a name.');
    var cats = Array.isArray(s.categories) ? s.categories : [];
    var catIds = {};
    cats.forEach(function (c, i) {
      if (!c || blank(c.name)) errors.push('Category ' + (i + 1) + ' needs a name.');
      if (c && c.id) { if (catIds[c.id]) errors.push('Duplicate category id "' + c.id + '".'); catIds[c.id] = true; }
    });
    var qs = Array.isArray(s.questions) ? s.questions : [];
    if (!qs.length) { errors.push('Add at least one question.'); return errors; }
    var seen = {};
    qs.forEach(function (q, i) {
      var label = blank(q && q.text) ? 'Question ' + (i + 1) : '"' + String(q.text).trim().slice(0, 40) + '"';
      if (!q || blank(q.text)) errors.push('Question ' + (i + 1) + ' needs text.');
      if (q && q.id) { if (seen[q.id]) errors.push(label + ' has a duplicate id.'); seen[q.id] = true; }
      if (!q || (q.type !== 'scale' && q.type !== 'text')) { errors.push(label + ' must be a scale or text question.'); return; }
      if (q.categoryId && !catIds[q.categoryId]) errors.push(label + ' points at a category that does not exist.');
      if (q.type === 'scale') {
        var sc = q.scale;
        if (!sc || !Number.isInteger(sc.min) || !Number.isInteger(sc.max) || sc.max <= sc.min) errors.push(label + ' needs a scale with a min and a larger max.');
        else { if (blank(sc.minLabel)) errors.push(label + ' needs a low-end label.'); if (blank(sc.maxLabel)) errors.push(label + ' needs a high-end label.'); }
      }
    });
    return errors;
  }

  function buildSurveyShareSeed(surveyDef, round, recipient) {
    return {
      schemaVersion: SCHEMA_VERSION,
      mode: 'survey',
      survey: surveyDef,
      round: { id: round.id, surveyId: round.surveyId, surveyVersion: round.surveyVersion },
      recipient: recipient ? { responderId: String(recipient.responderId), label: String(recipient.label || '').trim() } : null,
      completedResponse: null
    };
  }

  /* Identity side. Idempotent on responderId so a re-imported file never
     double-counts who is "in". */
  function addReceipt(list, receipt) {
    var out = (list || []).slice();
    for (var i = 0; i < out.length; i++) {
      if (out[i] && out[i].responderId === receipt.responderId) { out[i] = receipt; return out; }
    }
    out.push(receipt);
    return out;
  }
  function hasBallot(list, ballotId) {
    return (list || []).some(function (b) { return b && b.ballotId === ballotId; });
  }
  /* Anonymous side. Strips any identity/time the ballot must never carry,
     dedups on ballotId (NEVER on responderId — that would rejoin the two
     stores), and inserts at a random position so arrival order is not a tell. */
  function addBallot(list, ballot, rand) {
    var clean = { ballotId: String(ballot.ballotId), roundId: String(ballot.roundId), answers: Array.isArray(ballot.answers) ? ballot.answers : [] };
    var out = (list || []).slice();
    for (var i = 0; i < out.length; i++) { if (out[i] && out[i].ballotId === clean.ballotId) { out[i] = clean; return out; } }
    var r = (typeof rand === 'function' ? rand() : Math.random());
    var pos = Math.floor(r * (out.length + 1));
    out.splice(pos, 0, clean);
    return out;
  }
  /* Completion is a roster-vs-receipts count only — it never reaches a ballot. */
  function surveyCompletion(roster, receipts) {
    var rs = (roster || []);
    var got = {};
    (receipts || []).forEach(function (x) { if (x && x.responderId != null) got[x.responderId] = true; });
    var responded = 0;
    rs.forEach(function (m) { if (m && got[m.responderId]) responded++; });
    return { responded: responded, total: rs.length, outstanding: Math.max(0, rs.length - responded), pct: rs.length ? Math.round(responded / rs.length * 100) : 0 };
  }

  /* Read-side aggregation over the anonymous ballot pool. Scale questions get a
     distribution + favorable %; text questions get a shuffled list. Both are
     gated below a minimum response count (scale: minN, text: the higher
     textFloor) so a tiny pool can't be reverse-engineered. */
  function surveyAggregate(surveyDef, ballots, opts) {
    var minN = (opts && opts.minN) || 3;
    var textFloor = (opts && opts.textFloor) || 5;
    var bs = ballots || [];
    var count = bs.length;
    var byQ = {};
    bs.forEach(function (b) {
      (b && b.answers || []).forEach(function (a) {
        if (!a || a.questionId == null) return;
        (byQ[a.questionId] = byQ[a.questionId] || []).push(a);
      });
    });
    var questions = (surveyDef.questions || []).map(function (q) {
      var ans = byQ[q.id] || [];
      if (q.type === 'scale') {
        var sc = q.scale || { min: 1, max: 5 };
        var dist = {}; for (var lv = sc.min; lv <= sc.max; lv++) dist[lv] = 0;
        var sum = 0, n = 0, fav = 0, mid = (sc.min + sc.max) / 2;
        ans.forEach(function (a) { if (Number.isInteger(a.value) && a.value >= sc.min && a.value <= sc.max) { dist[a.value]++; sum += a.value; n++; if (a.value > mid) fav++; } });
        return { id: q.id, type: 'scale', text: q.text, categoryId: q.categoryId, gated: count < minN, answered: n, distribution: dist, avg: n ? sum / n : null, favorablePct: n ? Math.round(fav / n * 100) : 0, scale: sc };
      }
      var tgated = count < textFloor;
      var texts = ans.map(function (a) { return String(a.text == null ? '' : a.text).trim(); }).filter(function (s) { return s; });
      return { id: q.id, type: 'text', text: q.text, categoryId: q.categoryId, gated: tgated, answered: texts.length, texts: tgated ? undefined : texts };
    });
    return { count: count, minN: minN, textFloor: textFloor, questions: questions };
  }

  /* ---------- multi-role rubric helpers ---------- */
  // Expected rating-level index for a dimension at a given seniority level.
  // dim.bar[levelId] overrides; otherwise seniority maps rank-for-rank. Always
  // clamped to the rubric height (levelCount-1) so a short rubric or a 5th
  // seniority tier never points past the top rung. seniorityIndex is supplied by
  // the caller because the seniority list (LEVELS) lives in app scope, outside
  // this sandboxed core.
  function expectedRung(dim, levelId, seniorityIndex, levelCount) {
    var top = Math.max(0, (levelCount || 1) - 1);
    var pick = (dim && dim.bar && dim.bar[levelId] != null) ? dim.bar[levelId] : (seniorityIndex || 0);
    return Math.max(0, Math.min(top, pick));
  }

  // Resolve which rubric (role) a person is rated against: their assigned rubric
  // if it still exists, otherwise the first rubric as a safe default.
  function rubricForPerson(person, rubrics) {
    var list = rubrics || [];
    if (person && person.rubricId) {
      for (var i = 0; i < list.length; i++) if (list[i].id === person.rubricId) return list[i];
    }
    return list[0] || null;
  }

  // One-time migration backfill: give every person a rubric (role). People who
  // already have one keep it (even a dangling id; the read-side resolver handles
  // that). Returns a new array and never mutates the input. No rubrics -> no-op.
  function backfillPersonRubric(people, rubrics) {
    var first = (rubrics && rubrics[0]) ? rubrics[0].id : null;
    return (people || []).map(function (p) {
      if (!p || p.rubricId || !first) return p;
      return Object.assign({}, p, { rubricId: first });
    });
  }

  // Re-build "Enhance" prompt: bake the current rubric in as JSON and tell Claude
  // to improve it without losing its intent. The scope chip drives the line Claude
  // must confirm before changing anything. Internal fields (id, version, the
  // expected-bar overlay) are stripped — Claude only reasons about the substance.
  function buildEnhancePrompt(rubric, scope) {
    var r = rubric || {};
    var scopeLine = scope === 'dims' ? 'only the dimensions I name — leave the rest exactly as they are'
      : scope === 'level' ? 'only the one level I name, on the dimensions I name — leave every other level untouched'
      : 'the whole rubric';
    var clean = {
      name: String(r.name || 'this rubric'),
      levelCount: r.levelCount || ((r.dimensions && r.dimensions[0] && r.dimensions[0].levels) ? r.dimensions[0].levels.length : 4),
      levelLabels: (r.levelLabels || []).slice(),
      dimensions: (r.dimensions || []).map(function (d) {
        d = d || {};
        return {
          name: String(d.name || ''),
          description: String(d.description || ''),
          levels: (d.levels || []).map(function (l) {
            l = l || {};
            return { level: l.level, label: String(l.label || ''), descriptor: String(l.descriptor || '') };
          })
        };
      })
    };
    return [
      'Here is my current ' + clean.name + ' rubric as JSON (below). Improve it WITHOUT discarding what it already measures.',
      '',
      '1. First, ask me what I want to fix or add, and confirm the scope is: ' + scopeLine + '.',
      '2. Keep the original intent, dimension names, and structure unless I explicitly ask to change them.',
      '3. Ask a few targeted questions, then return the updated rubric as JSON in exactly the same shape (name, levelCount, levelLabels, dimensions[].levels[].descriptor) inside a ```json code block. Put nothing else inside the block.',
      '',
      JSON.stringify(clean, null, 2)
    ].join('\n');
  }

  // Fold Claude's re-built rubric back into the role being edited. The role keeps
  // its identity (id, version, slot) so person assignments and history still point
  // at it. Enhance carries the expected-bar overlay forward onto any dimension whose
  // name still matches; Start-fresh is a clean slate. Mutates neither input.
  function mergeRebuild(target, parsed, mode) {
    var t = target || {}, p = parsed || {};
    var dims = (p.dimensions || []).map(function (d) {
      var copy = {};
      for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) copy[k] = d[k];
      return copy;
    });
    if (mode !== 'fresh') {
      var barByName = {};
      (t.dimensions || []).forEach(function (d) {
        if (d && d.bar) barByName[String(d.name || '').trim().toLowerCase()] = d.bar;
      });
      dims.forEach(function (d) {
        var bar = barByName[String(d.name || '').trim().toLowerCase()];
        if (bar) d.bar = bar;
      });
    }
    return {
      id: t.id,
      name: String(p.name || t.name || 'Custom rubric'),
      version: t.version || 1,
      levelCount: p.levelCount,
      levelLabels: p.levelLabels,
      dimensions: dims
    };
  }

  /* ---------- onboarding (spec: docs/superpowers/specs/2026-06-30-onboarding-flow-design.md) ----------
     deriveSetup is PURE and takes a snapshot, never the live store — the progress
     widget is derived, never stored (spec §6.2). onboarding record shape:
     { completedSteps: [1..4], placeholders: {rubricId: count}, sent: {firstNameLower: true} } */
  function rubricReady(r) { return validateRubric(r).length === 0; }
  function rowComplete(p) {
    return !!(p && String(p.firstName || '').trim() && p.rubricId && p.level != null);
  }
  function sendEligible(p, rubrics) {
    if (!p || !String(p.firstName || '').trim() || !p.rubricId) return false;
    var r = (rubrics || []).filter(function (x) { return x.id === p.rubricId; })[0];
    return !!(r && rubricReady(r));
  }
  function deriveSetup(s) {
    var ob = s.onboarding || { completedSteps: [], placeholders: {}, sent: {} };
    var steps = ob.completedSteps || [];
    var cards = [];
    var STEP_LABELS = { 1: 'Your profile', 2: 'Team structure', 3: 'Rubric choices', 4: 'Self-assessments' };
    [1, 2, 3, 4].forEach(function (n) {
      cards.push({ kind: 'step', step: n, label: STEP_LABELS[n],
        status: steps.indexOf(n) !== -1 ? 'done' : 'todo',
        go: { view: 'onboard', params: { step: n } } });
    });
    var phTotal = 0;
    Object.keys(ob.placeholders || {}).forEach(function (k) { phTotal += ob.placeholders[k] || 0; });
    var unnamed = phTotal;
    if (unnamed > 0 || steps.indexOf(2) !== -1) {
      cards.push({ kind: 'name', label: 'Name your teammates', count: unnamed,
        status: unnamed === 0 ? 'done' : 'todo', go: { view: 'dash', params: {} } });
    }
    (s.rubrics || []).forEach(function (r) {
      if (!rubricReady(r)) {
        cards.push({ kind: 'rubric', rubricId: r.id, label: 'Finish the ' + r.name + ' rubric',
          path: r.setupPath || 'manual', status: 'todo',
          go: { view: 'rubric', params: { rubricId: r.id } } });
      }
    });
    var people = s.people || [];
    var sent = ob.sent || {};
    var sentCount = people.filter(function (p) { return sent[String(p.firstName || '').toLowerCase()]; }).length;
    if (people.length || phTotal) {
      cards.push({ kind: 'send', label: 'Send self-assessments', sentCount: sentCount,
        total: people.length + phTotal,
        status: (people.length > 0 && sentCount >= people.length && phTotal === 0) ? 'done' : 'todo',
        go: { view: 'onboard', params: { step: 4 } } });
    }
    /* done step cards let the widget show the trail. done = nothing left anywhere. */
    var done = cards.every(function (c) { return c.status === 'done'; });
    return { cards: cards, done: done,
      doneCount: cards.filter(function (c) { return c.status === 'done'; }).length,
      total: cards.length };
  }
  /* Step 2 commit + re-entry guards (spec §4.2). PURE: takes
     input {memberCount, roles:[{id?, name, levels}]} and state
     {rubrics, people, placeholders}; returns {rubrics, placeholders, errors}.
     Never deletes a named person; placeholder seats have no real role until
     the teammate modal assigns one, so their spread across roles is cosmetic. */
  function applyTeamStructure(input, state) {
    var errors = [];
    var roles = (input.roles || []).map(function (r) {
      return { id: r.id || null, name: String(r.name || '').trim(), levels: parseInt(r.levels, 10) || 4 };
    }).filter(function (r) { return r.name; });
    var memberCount = parseInt(input.memberCount, 10) || 0;
    if (memberCount < 1) errors.push('How many people are on your team? At least 1.');
    if (!roles.length) errors.push('Add and name at least one role.');
    var keptIds = {};
    roles.forEach(function (r) { if (r.id) keptIds[r.id] = true; });
    (state.rubrics || []).forEach(function (old) {
      if (keptIds[old.id]) return;
      var assigned = (state.people || []).filter(function (p) { return p.rubricId === old.id; });
      if (assigned.length) {
        errors.push('"' + old.name + '" still has ' + assigned.length + ' team member' +
          (assigned.length > 1 ? 's' : '') + ' assigned — move them to another role before removing it.');
      }
    });
    var named = (state.people || []).length;
    var available = memberCount - named;
    if (available < 0) {
      errors.push('You already have ' + named + ' named ' + (named > 1 ? 'people' : 'person') +
        ' — the team size can’t go below that.');
    }
    var newRubrics = [];
    roles.forEach(function (r) {
      if (r.id) {
        var old = (state.rubrics || []).filter(function (x) { return x.id === r.id; })[0];
        if (!old) { errors.push('Unknown role "' + r.name + '".'); return; }
        var ready = validateRubric(old).length === 0;
        if (ready && r.levels !== old.levelCount) {
          errors.push('"' + r.name + '" already has a working rubric — change its levels on the Rubric page, not here.');
          newRubrics.push(old);
          return;
        }
        var upd = JSON.parse(JSON.stringify(old));
        upd.name = r.name;
        if (!ready) {
          upd.levelCount = r.levels;
          upd.levelLabels = [];
          for (var i = 1; i <= r.levels; i++) upd.levelLabels.push(String(i));
        }
        newRubrics.push(upd);
      } else {
        var labels = [];
        for (var j = 1; j <= r.levels; j++) labels.push(String(j));
        newRubrics.push({ id: uid('rub'), name: r.name, version: 1, levelCount: r.levels, levelLabels: labels, dimensions: [], setupPath: null });
      }
    });
    /* placeholder seats: keep surviving roles' previous counts, then trim
       (reverse order) or grow (round-robin) to exactly `available` */
    var placeholders = {};
    var prev = state.placeholders || {};
    newRubrics.forEach(function (r) { placeholders[r.id] = prev[r.id] || 0; });
    var ids = newRubrics.map(function (r) { return r.id; });
    var sum = ids.reduce(function (a, id) { return a + placeholders[id]; }, 0);
    var k;
    if (available >= 0) {
      k = ids.length - 1;
      while (sum > available && k >= 0) {
        var cut = Math.min(placeholders[ids[k]], sum - available);
        placeholders[ids[k]] -= cut; sum -= cut;
        if (placeholders[ids[k]] === 0) k--;
      }
      k = 0;
      while (sum < available && ids.length) {
        placeholders[ids[k % ids.length]]++; sum++; k++;
      }
    }
    return { rubrics: newRubrics, placeholders: placeholders, errors: errors };
  }

  return {
    SCHEMA_VERSION: SCHEMA_VERSION,
    deriveSetup: deriveSetup,
    sendEligible: sendEligible,
    rowComplete: rowComplete,
    applyTeamStructure: applyTeamStructure,
    serializeSeed: serializeSeed,
    parseSeed: parseSeed,
    replaceSeedInHtml: replaceSeedInHtml,
    extractSeedFromHtml: extractSeedFromHtml,
    bakeFile: bakeFile,
    safeFileName: safeFileName,
    validateRubric: validateRubric,
    validateAssessmentComplete: validateAssessmentComplete,
    parseImport: parseImport,
    parseClaudeRubric: parseClaudeRubric,
    pairUp: pairUp,
    reconcileDraft: reconcileDraft,
    pickPair: pickPair,
    expectedRung: expectedRung,
    rubricForPerson: rubricForPerson,
    backfillPersonRubric: backfillPersonRubric,
    buildEnhancePrompt: buildEnhancePrompt,
    mergeRebuild: mergeRebuild,
    assessmentHistory: assessmentHistory,
    buildTrend: buildTrend,
    migrateAssessments: migrateAssessments,
    dashSummary: dashSummary,
    teamSkillSeries: teamSkillSeries,
    squadSkillTable: squadSkillTable,
    personSkillMatrix: personSkillMatrix,
    setupProgress: setupProgress,
    rubricContentFingerprint: rubricContentFingerprint,
    gapInfo: gapInfo,
    gapMeaning: gapMeaning,
    pctForLevel: pctForLevel,
    pctForLevelEdge: pctForLevelEdge,
    uid: uid,
    todayISO: todayISO,
    buildShareSeed: buildShareSeed,
    buildDemoData: buildDemoData,
    validateSurvey: validateSurvey,
    buildSurveyShareSeed: buildSurveyShareSeed,
    addReceipt: addReceipt,
    hasBallot: hasBallot,
    addBallot: addBallot,
    surveyCompletion: surveyCompletion,
    surveyAggregate: surveyAggregate
  };
})();
if (typeof window !== 'undefined') window.CaliberCore = CaliberCore;
</script>

  var sbEl = document.getElementById('caliber-survey-bank');

} catch (e) { SURVEY_BANK = { categories: [], questions: [] }; }
function bankCategory(id) {
  for (var i = 0; i < SURVEY_BANK.categories.length; i++) if (SURVEY_BANK.categories[i].id === id) return SURVEY_BANK.categories[i];
  return null;

/* A baked survey file (mode 'survey') is opened by a RESPONDER and shares the

  draft: 'caliber.draft',
  people: 'caliber.people',
  managerName: 'caliber.managerName',
  shareDone: 'caliber.shareDone',
  squads: 'caliber.squads',
  feedback: 'caliber.feedback',

  prep: 'caliber.prep',

  editRubric: 'caliber.editRubric',
  savedAt: 'caliber.savedAt',
  schema: 'caliber.schema',
  surveys: 'caliber.surveys',

  surveyBallots: 'caliber.surveyBallots',

function lsGet(key, fallback) {

   edits any of them via editingRubric(), so a per-role drift check is required —

/* group people by squad (a person may appear in several squads); the rest land
   in "Unassigned". Within each group: by level ascending, then name. */
function groupBySquad(people) {
  var assigned = {}, groups = [];
  store.squads.forEach(function (s) {
    var members = people.filter(function (p) { return s.memberFirstNames.some(function (n) { return n.toLowerCase() === p.firstName.toLowerCase(); }); });
    if (!members.length) return;
    members.forEach(function (p) { assigned[p.firstName.toLowerCase()] = 1; });
    groups.push({ name: s.name, id: s.id, members: members });
  });
  var rest = people.filter(function (p) { return !assigned[p.firstName.toLowerCase()]; });
  if (rest.length) groups.push({ name: 'Unassigned', id: null, members: rest });
  groups.forEach(function (g) {
    g.members.sort(function (a, b) { var d = levelRank(a.level) - levelRank(b.level); return d !== 0 ? d : a.firstName.localeCompare(b.firstName); });
  });
  return groups;
}
function roleBadge(p, r) {
  /* Multi-role: label each person with THEIR assigned rubric, not the active one. */
  var pr = Core.rubricForPerson(p, store.rubrics) || r;
  var role = pr ? esc(pr.name) : '', lvl = p.level ? esc(p.level) : '';
  if (role && lvl) return '<b>' + role + '</b> &middot; ' + lvl;
  if (lvl) return lvl;
  if (role) return '<b>' + role + '</b>';
  return '<span class="muted">No level set</span>';
}
function pillsHtml(pills, maxGap) {
  var bars = Math.max(1, maxGap || 3);
  return (pills || []).map(function (p) {
    if (p.type === 'gap') {
      var meter = '';
      for (var i = 1; i <= bars; i++) meter += '<i' + (i <= p.value ? ' class="on"' : '') + '></i>';
      return '<span class="pill pill--gap" title="' + esc(p.name) + ' — ' + p.value + '-level gap, worth a 1:1">' + esc(p.name) + ' <span class="meter" aria-hidden="true">' + meter + '</span></span>';
    }
    if (p.type === 'low') return '<span class="pill pill--low" title="Lower-rated — room to grow">' + esc(p.name) + ' <span class="d">lv ' + p.value + '</span></span>';
    return '<span class="pill pill--strength" title="A strength — you both rate this high">' + ICON.check + esc(p.name) + '</span>';
  }).join('');
}
function rowMiddle(row, r) {
  if (row.status === 'ready') {
    var maxGap = Math.max(1, ((r && r.levelCount) || 4) - 1);
    var inner = (row.pills && row.pills.length) ? pillsHtml(row.pills, maxGap)
      : '<span class="pill pill--strength" title="Aligned across the board">' + ICON.check + 'In step across all</span>';
    return '<div class="pills">' + inner + '</div>';
  }
  var msg = row.status === 'awaiting-you' ? '<span class="pprompt"><b>Your move</b> — rate to see the gap</span>'
    : row.status === 'awaiting-self' ? '<span class="pprompt">Self-assessment pending — <b>send a reminder</b></span>'
      : '<span class="pprompt muted">Not started — <b>rate to begin</b></span>';
  return '<div class="pills">' + msg + '</div>';
}
function rowActions(st, first) {
  var f = esc(first);
  var view = '<button class="iconbtn" data-action="openResults" data-first="' + f + '" title="View results" aria-label="View ' + f + '&#39;s results">' + ICON.eye + '</button>';
  var rate = '<button class="iconbtn iconbtn--accent" data-action="startRate" data-first="' + f + '" title="Re-rate" aria-label="Re-rate ' + f + '">' + ICON.pencil + '</button>';
  var send = '<button class="iconbtn iconbtn--accent" data-action="openShare" data-first="' + f + '" title="Send self-assessment" aria-label="Send self-assessment to ' + f + '">' + ICON.send + '</button>';
  if (st === 'ready') return view + rate;
  if (st === 'awaiting-you') return rate;
  if (st === 'awaiting-self') return send + rate;
  return send + rate;
}

/* home setup widget (spec §6): derived fresh every render, never stored.
   Shows whenever an onboarding record exists and anything is left to do —
   including gaps that appear long after onboarding (new placeholder, a
   rubric back in draft). Disappears by doing the work, not by dismissing. */
var setupCards = []; /* last derivation, so setupGo can route by index */
/* living team strip: one figure per named teammate (stable by roster order),
   capped at 6 + overflow chip. Purely decorative — hidden from screen readers. */
function teamStrip() {
  if (!store.people.length) return '';
  var figs = '';
  var n = Math.min(store.people.length, 6);
  for (var i = 0; i < n; i++) figs += '<div class="ts-fig">' + ILLO['team' + (i % 6 + 1)] + '</div>';
  var more = store.people.length > 6 ? '<span class="ts-more">+' + (store.people.length - 6) + '</span>' : '';
  return '<div class="team-strip" aria-hidden="true"><div class="ts-plants">' + ILLO.plantsScene + '</div>' +
    '<div class="ts-figs">' + figs + more + '</div></div>';
}
function setupWidget() {
  if (SHARED_FILE || !store.onboarding) return '';
  var s = Core.deriveSetup({ managerName: store.managerName, people: store.people, rubrics: store.rubrics, assessments: store.assessments, onboarding: store.onboarding });
  if (s.done) { setupCards = []; return ''; }
  setupCards = s.cards;
  var cards = s.cards.map(function (c, i) {
    var sub = c.kind === 'name' ? (c.count ? c.count + ' to go' : 'Done')
      : c.kind === 'send' ? c.sentCount + ' of ' + c.total + ' sent'
      : c.kind === 'rubric' ? (c.path === 'claude' ? 'Draft waiting' : 'Not written yet')

  }).join('');
  return '<div class="setupw"><div class="setupw-head"><h2>Finish setting up</h2>' +
    '<span class="small muted">' + s.doneCount + ' of ' + s.total + ' done</span></div>' +
    '<div class="setupw-bar"><i style="width:' + Math.round(100 * s.doneCount / s.total) + '%"></i></div>' +

  if (rated.length) {
    var strongest = rated.slice().sort(function (a, b) { return b.manager - a.manager; })[0];
    var over = rated.filter(function (s) { return s.self - s.manager >= 0.25; }).map(function (s) { return s.name; });
    var under = rated.filter(function (s) { return s.manager - s.self >= 0.25; }).map(function (s) { return s.name; });
    insight = 'Strongest in <b>' + esc(strongest.name) + '</b>.';
    if (over.length) insight += ' The team rates itself above your read on <b>' + esc(joinList(over)) + '</b>' + (under.length ? ';' : '.');
    if (under.length) insight += (over.length ? ' you read ' : ' You read ') + '<b>' + esc(joinList(under)) + '</b> higher than they do.';
    if (!over.length && !under.length) insight += ' Self-ratings and your read line up across the board.';
  }
  var yaxis = '', lines = '';
  for (var i = 0; i <= N; i++) {
    var p = i / N * 100;
    yaxis += '<div class="tsc-yl" style="bottom:' + p + '%">' + i + '</div>';
    lines += '<div class="tsc-line' + (i === 0 ? ' base' : '') + '" style="bottom:' + p + '%"></div>';
  }
  var groups = '', xrow = '';
  series.forEach(function (s, gi) {
    var delay = gi * 45;
    var hs = s.self != null ? Math.round(s.self / N * 100) : 0;
    var hm = s.manager != null ? Math.round(s.manager / N * 100) : 0;
    var selfTxt = s.self != null ? s.self.toFixed(1) : '—';
    var mgrTxt = s.manager != null ? s.manager.toFixed(1) : '—';
    var gtxt = 'partial';
    if (s.self != null && s.manager != null) {
      var gap = s.self - s.manager;
      gtxt = Math.abs(gap) < 0.05 ? 'aligned' : (gap > 0 ? 'self +' + gap.toFixed(1) : 'you +' + Math.abs(gap).toFixed(1));
    }
    /* Tooltip is built in wires.dash via textContent (name) + a text node (rest),
       so the dimension name is never parsed as HTML — keep them as separate data-* . */
    var tipRest = ' · self ' + selfTxt + ', you ' + mgrTxt + ' (' + gtxt + ')';
    var al = esc(s.name) + ', team self-rating ' + selfTxt + ' of ' + N + ', your rating ' + mgrTxt;
    groups += '<div class="tsc-group">' +
      '<button class="tsc-bar self" style="height:0%;transition-delay:' + delay + 'ms" data-h="' + hs + '%" data-dim="' + esc(s.name) + '" data-tip="' + tipRest + '" aria-label="' + al + '"></button>' +
      '<button class="tsc-bar mgr" style="height:0%;transition-delay:' + delay + 'ms" data-h="' + hm + '%" data-dim="' + esc(s.name) + '" data-tip="' + tipRest + '" aria-label="' + al + '"></button></div>';
    xrow += '<div class="tsc-xl">' + esc(s.name) + '</div>';
  });
  var chart = '<div class="tsc" id="teamChart" role="group" aria-label="Average team self-rating versus your rating, by skill">' +
    '<div class="tsc-yaxis">' + yaxis + '</div>' +
    '<div class="tsc-plot">' + lines + '<div class="tsc-groups">' + groups + '</div></div>' +
    '<div class="tsc-xrow">' + xrow + '</div>' +
    '<div class="tsc-tip" id="tscTip" hidden></div></div>';
  return '<div class="ts-head"><div class="eyebrow">Team skills</div></div>' +
    '<div class="ts-card">' + (insight ? '<p class="ts-insight">' + insight + '</p>' : '') + chart +
    '<div class="tsk-legend"><span class="lg"><span class="dot self"></span>Team self-rating</span>' +
    '<span class="lg"><span class="dot mgr"></span>Your rating</span></div></div>';
}

/* Re-build dialog: hand the current rubric to Claude and fold the reply back into

   chosen scope; Start fresh reuses the from-scratch authoring prompt and overwrites.

   mergeRebuild). State: rebuildMode ('enhance'|'fresh'), rebuildScope. */
function rebuildModalHTML() {

    '<button class="btn" data-action="closeModal">Cancel</button>' +
    '<button class="btn btn--primary" data-action="applyRebuild">Apply</button></div>';

  return '<div class="modal-overlay">' +
    '<div class="modal modal--wide" role="dialog" aria-modal="true" aria-label="Re-build rubric">' +
    '<div class="modal__head"><h3 class="modal__title">Re-build the ' + esc(r.name) + ' rubric</h3>' +
    '<button class="iconx" data-action="closeModal" aria-label="Close">&times;</button></div>' +

var authoringInput = { role: '', context: '', dims: '6', levels: '4' };
function defaultLevelLabels(n) {
  var four = ['Developing', 'Proficient', 'Advanced', 'Leading'];
  if (n === 4) return four;
  var pools = {
    2: ['Developing', 'Strong'],
    3: ['Developing', 'Proficient', 'Leading'],
    5: ['Beginning', 'Developing', 'Proficient', 'Advanced', 'Leading'],
    6: ['Beginning', 'Developing', 'Proficient', 'Advanced', 'Leading', 'Exemplary']
  };
  return pools[n] || four.slice(0, n);
}
function buildAuthoringPrompt() {
  var n = Math.max(2, Math.min(6, parseInt(authoringInput.levels, 10) || 4));
  var d = Math.max(3, Math.min(10, parseInt(authoringInput.dims, 10) || 6));
  var role = authoringInput.role.trim() || 'an individual contributor on my team';
  var labels = defaultLevelLabels(n);
  var ctx = authoringInput.context.trim();
  var lines = [
    'You are helping a manager build a skills rubric for ' + role + '. Work through THREE steps in order. Do not skip ahead, and do not output the final JSON until Step 3.',
    '',
    'STEP 1 — Check for existing material.',
    'Before anything else, ask the manager a single question: do they already have a skills matrix, leveling guide, competency framework, career ladder, or job description for this role that they can paste in?',
    '- If they share one, build the rubric\'s dimensions and level descriptors on top of it — keep their language and structure, and use Step 2 only to fill gaps and confirm.',
    '- If they don\'t have one, build the rubric from their Step 2 answers.',
    'Ask this first and wait for their reply before continuing.',
    '',
    'STEP 2 — Ask a short quiz using the in-chat interactive option picker.',
    'Use your native tappable multiple-choice questions (the ask_user_input tool), NOT a separate JSX/HTML artifact or app. Ask 10 to 15 questions, a few at a time. For open-ended questions, still present them through the picker with a few example options plus a free-text "Other" choice so the manager can answer in their own words.',
    'The questions exist to capture THIS team\'s criteria — what they actually want to measure and reward. Cover things like:',
    '- Which skill areas matter most for this role (you will turn the chosen ones into the ' + d + ' dimensions).',
    '- What "great" looks like day-to-day, in the team\'s own words.',
    '- How the team separates a higher level from a lower one — scope, autonomy, ambiguity, and impact expectations.',
    '- The balance between craft, collaboration, communication, and outcomes for this team.',
    '- Anything specific to how this team operates that a generic rubric would miss.',
    'Keep each question tight and concrete, and prefer pick-an-option over write-an-essay.'
  ];
  if (ctx) {
    lines.push('The manager already told Caliber this about the team — fold it into the questions instead of re-asking it: ' + ctx);
  }
  lines.push('Wait for the manager to answer before continuing.');
  lines.push('');
  lines.push('STEP 3 — Deliver the rubric.');
  lines.push('Only after you have their answers (and their existing doc, if they shared one), produce the rubric as a JSON object in EXACTLY this shape:');
  lines.push('');
  lines.push('{');
  lines.push('  "name": "' + (role.length < 40 ? role.replace(/^an? /, '') : 'Custom') + ' rubric",');
  lines.push('  "levelCount": ' + n + ',');
  lines.push('  "levelLabels": ' + JSON.stringify(labels) + ',');
  lines.push('  "dimensions": [');
  lines.push('    {');
  lines.push('      "name": "<skill area>",');
  lines.push('      "description": "<one sentence: what this dimension covers>",');
  lines.push('      "notePrompt": "<one short, friendly question inviting the person to add a note — either asking for a recent concrete example of this skill, or asking what support/tools would help them grow in it>",');
  lines.push('      "levels": [');
  lines.push('        { "level": 1, "label": "' + labels[0] + '", "descriptor": "<1-2 sentences, concrete and behavioral>" }');
  lines.push('        // ... one object per level, level 1 through ' + n);
  lines.push('      ]');
  lines.push('    }');
  lines.push('    // ... ' + d + ' dimensions total');
  lines.push('  ]');
  lines.push('}');
  lines.push('');
  lines.push('Deliver it BOTH ways so it is easy to get into Caliber:');
  lines.push('1. Save it as a downloadable file named "caliber-rubric.json" the manager can download in one click.');
  lines.push('2. Also paste the exact same JSON inline in a ```json code block, so they can copy it straight from the chat if they prefer.');
  lines.push('Put nothing else inside the JSON or the code block — no comments, no trailing notes.');
  lines.push('');
  lines.push('Requirements for the JSON:');
  lines.push('- Exactly ' + d + ' dimensions, each with exactly ' + n + ' levels using these labels in order: ' + labels.join(', ') + '.');
  lines.push('- Ground every dimension and descriptor in the manager\'s quiz answers and existing doc — this rubric should read like THIS team wrote it, not a generic template.');
  lines.push('- Descriptors must be ORIGINAL, concrete, and behavioral — describe observable actions ("proactively pulls in the right people"), not vague adjectives ("is great at collaboration").');
  lines.push('- Every dimension gets a "notePrompt": vary them — mix "give a recent example" asks with "what support would help you grow here" asks, phrased for the person rating THEMSELVES.');
  lines.push('- Each level must read as a clear step up from the one before it, and be written so BOTH a manager and the person themselves could honestly pick it.');
  lines.push('- Plain language, no corporate jargon.');
  lines.push('');
  lines.push('Recap: Step 1 ask about an existing doc, Step 2 a quick in-chat multiple-choice quiz (no separate form), Step 3 deliver the JSON as a downloadable file AND a code block — only after the manager has answered.');
  return lines.join('\n');
}

function feedbackCard(first) {

/* The 1:1-prep errand: turn the gap map + descriptors + notes into a prompt
   the manager runs in their OWN Claude (free, private). Claude drafts the
   conversation — questions and an agenda — never the verdict. Extends the
   proven authoring copy-prompt pattern from rubric-building into coaching. */
function buildPrepPrompt(first) {
  var pair = pairFor(first);
  var rUsed = (pair && rubricById(pair.rubricId)) || activeRubric();
  var lines = [];
  rUsed.dimensions.forEach(function (d) {
    var sr = pair.self && pair.self.ratings.filter(function (r) { return r.dimensionId === d.id; })[0];
    var mr = pair.manager && pair.manager.ratings.filter(function (r) { return r.dimensionId === d.id; })[0];
    var g = Core.gapInfo(sr && sr.level, mr && mr.level);
    var slv = sr && Number.isInteger(sr.level) ? d.levels[Math.min(sr.level, rUsed.levelCount) - 1] : null;
    var mlv = mr && Number.isInteger(mr.level) ? d.levels[Math.min(mr.level, rUsed.levelCount) - 1] : null;
    lines.push('- ' + d.name + ' [' + Core.gapMeaning(g).label + ']');
    if (mlv) lines.push('    Manager rated L' + mr.level + ' ' + mlv.label + ': ' + mlv.descriptor + (mr.note ? ' (manager note: ' + mr.note + ')' : ''));
    if (slv) lines.push('    Self rated L' + sr.level + ' ' + slv.label + ': ' + slv.descriptor + (sr.note ? ' (self note: ' + sr.note + ')' : ''));
  });
  var fb = feedbackFor(first).slice(0, 5).map(function (n) { return '- ' + n.date + ': ' + n.text; });
  return [
    'You are helping a manager prepare for a 1:1 coaching conversation with ' + first + '. Below is ' + first + '’s self-rating next to the manager’s rating on a "' + rUsed.name + '" skills rubric. Where they differ is the agenda: a difference is a blind spot or a hidden strength to talk through, NOT a verdict or a score.',
    '',
    'Help the manager ASK, not tell. Do not write a performance verdict, assign a rating, or put words in ' + first + '’s mouth.',
    '',
    'The two reads:',
    lines.join('\n'),
    fb.length ? '\nManager’s recent notes on ' + first + ':\n' + fb.join('\n') : '',
    '',
    'Give me, in plain text with no preamble:',
    '1. For each area where the reads differ, 1-2 open, non-leading questions to explore it together (curious, not accusatory).',
    '2. For each of those, one concrete, observable example the manager could ask ' + first + ' to walk through.',
    '3. A short 15-20 minute 1:1 agenda that opens on a shared strength before getting into the gaps.'
  ].join('\n');
}

/* ---------- score-over-time (H2): trend card on Results ---------- */
var resultsTrendMode = 'overall'; /* 'overall' (default) | 'dims' */
function trendNum(v) { return Math.round(v * 10) / 10; }
function shortDate(iso) {
  var p = String(iso || '').split('-');
  if (p.length !== 3) return String(iso || '');
  var mo = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][parseInt(p[1], 10) - 1] || '';
  return mo + ' ' + parseInt(p[2], 10);
}
/* One SVG, shared by the overall (avg) and per-dimension (level) views. Points
   are {date, val}; nulls are skipped so a side with a gap just doesn't plot
   there. Manager drawn first so the self line/dots sit on top, matching the
   gap ladder's z-order. */
function trendSpark(selfPts, mgrPts, trend, opts) {
  opts = opts || {};
  var W = opts.w || 340, H = opts.h || 150, compact = !!opts.compact;
  var padL = compact ? 7 : 22, padR = 10, padT = 10, padB = compact ? 8 : 24;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var dates = trend.dates, n = dates.length, lc = trend.levelCount;
  function xFor(date) { return n <= 1 ? padL + plotW / 2 : padL + (dates.indexOf(date) / (n - 1)) * plotW; }
  function yFor(val) { return lc <= 1 ? padT + plotH / 2 : padT + (1 - (val - 1) / (lc - 1)) * plotH; }
  var grid = '';
  if (!compact) {
    for (var lv = 1; lv <= lc; lv++) {
      var gy = yFor(lv);
      grid += '<line class="tg-grid" x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '"/>' +
        '<text class="tg-ylab" x="' + (padL - 6) + '" y="' + (gy + 3).toFixed(1) + '" text-anchor="end">' + lv + '</text>';
    }
  }
  function draw(pts, cls) {
    var p = pts.filter(function (q) { return q.val != null; }).map(function (q) { return { x: xFor(q.date), y: yFor(q.val) }; });
    if (!p.length) return '';
    var line = p.length > 1 ? '<polyline class="tg-line ' + cls + '" points="' + p.map(function (q) { return q.x.toFixed(1) + ',' + q.y.toFixed(1); }).join(' ') + '"/>' : '';
    return line + p.map(function (q) { return '<circle class="tg-dot ' + cls + '" cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="' + (compact ? 2.4 : 3.4) + '"/>'; }).join('');
  }
  var xlabs = '';
  if (!compact && n) {
    xlabs = '<text class="tg-xlab" x="' + padL + '" y="' + (H - 6) + '" text-anchor="start">' + esc(shortDate(dates[0])) + '</text>';
    if (n > 1) xlabs += '<text class="tg-xlab" x="' + (W - padR) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(shortDate(dates[n - 1])) + '</text>';
  }
  return '<svg class="tg-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-hidden="true">' +
    grid + draw(mgrPts, 'tg-mgr') + draw(selfPts, 'tg-self') + xlabs + '</svg>';
}
function trendCard(trend, pair) {
  function delta(series) {
    var pts = series.filter(function (p) { return p.avg != null; });
    return pts.length < 2 ? null : { from: pts[0].avg, to: pts[pts.length - 1].avg };
  }
  function phrase(which, d) {
    if (!d) return null;
    if (d.to > d.from) return which + ' rose from L' + trendNum(d.from) + ' to L' + trendNum(d.to);
    if (d.to < d.from) return which + ' eased from L' + trendNum(d.from) + ' to L' + trendNum(d.to);
    return which + ' held around L' + trendNum(d.to);
  }
  var bits = [];
  var sp = phrase(esc(pair.firstName) + '&#39;s self-read', delta(trend.overall.self));
  var mp = phrase('your read', delta(trend.overall.manager));
  if (sp) bits.push(sp);
  if (mp) bits.push(mp);
  var caption = bits.length ? bits.join(' &middot; ') + '.' : 'Two or more readings, side by side over time.';
  var seg = '<div class="tg-seg" role="group" aria-label="Trend view">' +
    '<button class="tg-segbtn' + (resultsTrendMode === 'overall' ? ' on' : '') + '" data-action="trendMode" data-mode="overall" aria-pressed="' + (resultsTrendMode === 'overall') + '">Overall</button>' +
    '<button class="tg-segbtn' + (resultsTrendMode === 'dims' ? ' on' : '') + '" data-action="trendMode" data-mode="dims" aria-pressed="' + (resultsTrendMode === 'dims') + '">By dimension</button></div>';
  var body;
  if (resultsTrendMode === 'dims') {
    body = '<div class="tg-dims">' + trend.byDimension.map(function (d) {
      return '<div class="tg-dim"><span class="tg-dim-name">' + esc(d.name) + '</span>' +
        trendSpark(d.self.map(function (p) { return { date: p.date, val: p.level }; }),
          d.manager.map(function (p) { return { date: p.date, val: p.level }; }), trend, { w: 180, h: 40, compact: true }) + '</div>';
    }).join('') + '</div>';
  } else {
    body = '<div class="tg-overall">' +
      trendSpark(trend.overall.self.map(function (p) { return { date: p.date, val: p.avg }; }),
        trend.overall.manager.map(function (p) { return { date: p.date, val: p.avg }; }), trend, { w: 340, h: 150 }) +
      '<p class="tg-cap">' + caption + '</p></div>';
  }
  return '<div class="card tg-card">' +
    '<div class="tg-head"><h2>How this is trending</h2>' + seg + '</div>' +
    '<p class="small muted tg-sub">' + trend.rounds.self + ' self ' + (trend.rounds.self === 1 ? 'reading' : 'readings') +
    ' &middot; ' + trend.rounds.manager + ' of yours, over time. A higher line is a higher rated level &mdash; a rise is growth, not a grade.</p>' +
    body +
    '<div class="legend tg-legend"><span><span class="tg-key tg-key-self"></span> ' + esc(pair.firstName) + ' (self)</span>' +
    '<span><span class="tg-key tg-key-mgr"></span> you (manager)</span></div></div>';
}

/* Person detail heatmap: skill (rows) x score level 1..N (cols), you vs self.
   Driven by Core.personSkillMatrix; only rendered in the both-rated branch so
   no sealed self-rating is ever exposed. Scale comes from rubric.levelCount. */
function heatmapCard(pair, rUsed) {
  var N = rUsed.levelCount, names = rUsed.levelLabels || [];
  var pm = Core.personSkillMatrix(store.assessments, pair.firstName, rUsed, rUsed.id);
  function lvlName(k) { return names[k - 1] ? k + ' · ' + names[k - 1] : 'level ' + k; }
  var grid = '<div class="dh-skill" style="position:static"></div>';
  for (var h = 1; h <= N; h++) { grid += '<div class="dh-colhead"><b>' + h + '</b>' + (names[h - 1] ? '<span>' + esc(names[h - 1]) + '</span>' : '') + '</div>'; }
  pm.dimensions.forEach(function (d) {
    var sLvl = Number.isInteger(d.self) ? Math.min(d.self, N) : null;
    var mLvl = Number.isInteger(d.manager) ? Math.min(d.manager, N) : null;
    grid += '<div class="dh-skill">' + esc(d.name) + '</div>';
    for (var k = 1; k <= N; k++) {
      var cls = 'dh-cell', mk = '';
      if (sLvl != null && mLvl != null) {
        var lo = Math.min(sLvl, mLvl), hi = Math.max(sLvl, mLvl);
        if (sLvl === mLvl) {
          if (k === mLvl) { cls += ' instep'; mk = '<span class="dh-mk both" title="You and ' + esc(pair.firstName) + ' agree: ' + esc(lvlName(k)) + '"></span>'; }
        } else {
          if (k >= lo && k <= hi) cls += ' span';
          if (k === mLvl) mk = '<span class="dh-mk you" title="Your rating: ' + esc(lvlName(k)) + '"></span>';
          else if (k === sLvl) mk = '<span class="dh-mk self" title="' + esc(pair.firstName) + ' self-rating: ' + esc(lvlName(k)) + '"></span>';
        }
      }
      grid += '<div class="' + cls + '">' + mk + '</div>';
    }
  });
  var legend = '<div class="dh-legend"><span class="lg"><span class="dh-mk you"></span> Your rating</span>' +
    '<span class="lg"><span class="dh-mk self"></span> ' + esc(pair.firstName) + ' self-rating</span>' +
    '<span class="lg"><span class="dh-mk both"></span> in step</span>' +
    '<span class="lg"><span class="sw"></span> the gap</span></div>';
  return '<div style="margin-top:var(--sp-4)">' +
    '<div class="ladder-head"><h2 style="font-family:var(--font-display);font-weight:var(--fw-medium);margin:0;font-size:18px">Skill by level</h2>' +
    '<span class="small muted">where each of you lands on the scale</span></div>' +
    '<div class="dh-card"><div class="dh-scrollwrap"><div class="dh-grid" role="group" aria-label="' + esc(pair.firstName) + ' skills by score level" ' +
    'style="grid-template-columns:minmax(116px,160px) repeat(' + N + ',minmax(54px,1fr))">' + grid + '</div></div>' + legend + '</div></div>';
}
views.results = function () {
  var first = route.params.first;
  var pair = pairFor(first);
  if (!pair || (!pair.self && !pair.manager)) {
    return '<div class="shell shell--narrow">' + topbar('dash') + '<h1>' + esc(first) + '</h1>' +
      '<div class="empty"><h2>Nothing to compare yet</h2><p>You need your rating, their self-rating, or ideally both.</p>' +
      '<div class="row" style="justify-content:center"><button class="btn btn--primary" data-action="startRate" data-first="' + esc(first) + '">Rate ' + esc(first) + '</button>' +
      '<button class="btn" data-action="openShare" data-first="' + esc(first) + '">Send self-assessment</button></div></div>' +
      feedbackCard(first) + '</div>';
  }
  /* Anti-anchoring (Torin, 2026-06-12): a received self-assessment stays
     sealed until the manager has rated this person, so the manager's read
     stays their own. */
  if (pair.self && !pair.manager) {
    return '<div class="shell shell--narrow">' + topbar('dash') +
      '<h1>' + esc(pair.firstName) + '</h1>' +
      '<div class="empty"><h2>Self-assessment received — and sealed</h2>' +
      '<p>' + esc(pair.firstName) + '&#39;s answers (from ' + esc(pair.self.date) + ') stay hidden until you&#39;ve done your own rating, so your read stays your own.</p>' +
      '<div class="row" style="justify-content:center"><button class="btn btn--primary" data-action="startRate" data-first="' + esc(pair.firstName) + '">Rate ' + esc(pair.firstName) + ' now</button></div></div>' +
      feedbackCard(pair.firstName) + '</div>';
  }
  var rUsed = rubricById(pair.rubricId) || activeRubric();
  var missing = !pair.self ? 'self' : (!pair.manager ? 'manager' : null);
  var verMismatch = [pair.self, pair.manager].some(function (a) { return a && rUsed && a.rubricVersion !== rUsed.version; });
  var rows = rUsed.dimensions.map(function (d, i) {
    var sr = pair.self && pair.self.ratings.filter(function (r) { return r.dimensionId === d.id; })[0];
    var mr = pair.manager && pair.manager.ratings.filter(function (r) { return r.dimensionId === d.id; })[0];
    return { d: d, i: i, sr: sr, mr: mr, g: Core.gapInfo(sr && sr.level, mr && mr.level) };
  });
  var both = !!(pair.self && pair.manager);
  /* the screen's job is "where do we talk" — biggest gaps first */
  if (both) rows.sort(function (a, b) { return (b.g.abs || 0) - (a.g.abs || 0) || a.i - b.i; });
  var gapRows = rows.filter(function (x) { return x.g.abs > 0; });
  var alignedRows = rows.filter(function (x) { return both && x.g.abs === 0; });

  function clampLvl(r) { return r && Number.isInteger(r.level) ? Math.min(r.level, rUsed.levelCount) : null; }
  function lvlObj(d, r) { var lv = clampLvl(r); return lv == null ? null : (d.levels[lv - 1] || d.levels[d.levels.length - 1]); }

  /* ---- the gap ladder: whole person on one sorted track ---- */
  function ladderRow(x) {
    var d = x.d, g = x.g, sLvl = clampLvl(x.sr), mLvl = clampLvl(x.mr);
    var ticks = '';
    for (var i = 1; i <= rUsed.levelCount; i++) ticks += '<span class="ltick" style="left:' + Core.pctForLevelEdge(i, rUsed.levelCount) + '%"></span>';
    var delta = '';
    if (sLvl != null && mLvl != null && sLvl !== mLvl) {
      var lo = Core.pctForLevelEdge(Math.min(sLvl, mLvl), rUsed.levelCount);
      var hi = Core.pctForLevelEdge(Math.max(sLvl, mLvl), rUsed.levelCount);
      delta = '<span class="ldelta" style="left:' + lo + '%;width:' + (hi - lo) + '%"></span>';
    }
    var marks = '';
    if (mLvl != null) marks += '<span class="lpin mgr" style="left:' + Core.pctForLevelEdge(mLvl, rUsed.levelCount) + '%" title="You: level ' + x.mr.level + '"></span>';
    if (sLvl != null) marks += '<span class="lpin self" style="left:' + Core.pctForLevelEdge(sLvl, rUsed.levelCount) + '%" title="' + esc(pair.firstName) + ': level ' + x.sr.level + '"></span>';

      '<span class="lname">' + esc(d.name) + '</span>' +
      '<span class="ltrack">' + ticks + delta + marks + '</span>' +
      '<span class="lgap' + (on ? ' on' : '') + '">' + lab + '</span></button>';
  }
  var pinSelf = '<span style="display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--c-bg);border:3px solid var(--c-self);vertical-align:middle"></span>';
  var pinMgr = '<span style="display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--c-manager);border:2px solid var(--c-bg);box-shadow:0 0 0 1px var(--c-manager);vertical-align:middle"></span>';
  var ladder = '<div class="card"><div class="ladder-head"><h2>' + (both ? 'Where your reads line up' : 'Your read so far') + '</h2>' +

  if (both) {

      ? '<p class="res-summary"><b>' + gapRows.length + (gapRows.length === 1 ? ' area' : ' areas') + ' worth a conversation.</b> ' + alignedRows.length + ' where you both see it the same.</p>'

  } else {
    summary = '<p class="res-summary">Your read is in. Send ' + esc(pair.firstName) + ' a self-assessment to surface the gaps worth a 1:1.</p>';
  }

  /* ---- focus cards: only where the reads DIFFER (no duplicate text) ---- */
  function sideBlock(cls, who, mark, x, isSelf) {
    var r = isSelf ? x.sr : x.mr, lv = lvlObj(x.d, r);

    return '<div class="side ' + cls + '"><span class="who">' + mark + ' ' + who + ' &middot; Level ' + clampLvl(r) + ' ' + esc(lv.label) + '</span>' +
      '<p class="desc">' + esc(lv.descriptor) + '</p>' +
      (r.note ? '<p class="note">&ldquo;' + esc(r.note) + '&rdquo;</p>' : '') + '</div>';
  }
  var focusCards = both ? gapRows.map(function (x) {
    var m = Core.gapMeaning(x.g);
    return '<div class="focus-card" id="focus-' + esc(x.d.id) + '"><span class="eyebrow">The conversation</span>' +
      '<h3>' + esc(x.d.name) + '</h3><p class="meaning">' + esc(m.label) + ' &middot; ' + esc(m.hint) + '</p>' +
      '<div class="twocol">' + sideBlock('mgr', 'You', '&#9660;', x, false) + sideBlock('self', esc(pair.firstName), '&#9650;', x, true) + '</div></div>';

        (lv ? '<p class="desc" style="color:var(--c-ink-70);font-size:var(--fs-2);margin:2px 0 0">' + esc(lv.descriptor) + '</p>' : '') + '</div>';
    }).join('');
    alignedStrip = '<details class="aligned-strip" id="aligned-details"><summary><b>' + alignedRows.length + ' aligned</b> &mdash; ' + names + '</summary>' + det + '</details>';
  }

  /* ---- 1:1 prep: the copy-prompt pattern, applied to coaching ---- */
  var prep = '';
  if (both) {
    var prepList = prepFor(pair.firstName).map(function (n) {
      return '<div class="prepnote"><div class="meta">' + esc(n.date) + ' &middot; Claude-assisted prep ' +
