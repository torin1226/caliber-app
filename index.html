<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caliber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGN TOKENS — merged from Caliber Design System.html (v0.1) at
   integration. The frozen CONTRACTS token names carry the real
   warm-paper / botanical-green values. Additive helper tokens
   (--font-display, --c-accent-deep, --c-accent-tint, --c-paper-deep,
   --c-self-tint, --c-warn-tint, --c-line-soft, --c-ink-70) are flagged
   design extras, not part of the frozen contract.
   ===================================================================== */
:root{
  /* ---- Linear-light edition (2026-06-28). Frozen CONTRACT token NAMES kept;
     VALUES remapped to the new system. Semantic shift: the one accent is now
     CLAY; green is reserved strictly for the delta/gap. ---- */
  --c-bg:#FAF8F5; --c-surface:#FFFFFF; --c-ink:#211D18; --c-muted:#948C81; --c-line:#EBE5DD;
  --c-accent:#BC5D38; --c-accent-ink:#FFFFFF;
  --c-self:#BC5D38; --c-manager:#211D18; --c-gap:#4E7A61;
  --c-success:#3C6450; --c-warn:#9A3B2A;
  /* additive helpers (not in CONTRACTS — flagged) */
  --c-accent-deep:#9F4A29; --c-accent-tint:#F7E7DD; --c-paper-deep:#F2EEE8;
  --c-self-tint:#F7E7DD; --c-warn-tint:#F3E1DA; --c-line-soft:#F2EEE8; --c-ink-70:#5C564E;
  --c-ink-2:#5C564E; --c-sunken:#F2EEE8; --c-faint:#CBC4BA;
  --c-gap-tint:#E5EDE7; --c-gap-deep:#3C6450; --c-clay:#BC5D38; --c-clay-press:#9F4A29; --c-clay-tint:#F7E7DD;
  --font-sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --fs-1:12px; --fs-2:14px; --fs-3:16px; --fs-4:22px; --fs-5:30px; --fs-6:46px;
  --lh-tight:1.1; --lh-normal:1.6;
  --fw-regular:400; --fw-medium:600; --fw-bold:600;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:18px; --r-2xl:22px; --r-pill:999px;
  /* warm, ink-tinted elevation — depth, not lines */
  --e1:0 1px 2px rgba(33,29,24,.05);
  --e2:0 2px 6px -1px rgba(33,29,24,.06),0 1px 2px rgba(33,29,24,.04);
  --e3:0 6px 16px -4px rgba(33,29,24,.10),0 2px 6px -2px rgba(33,29,24,.06);
  --e4:0 14px 32px -8px rgba(33,29,24,.14),0 4px 10px -4px rgba(33,29,24,.07);
  --e5:0 28px 60px -12px rgba(33,29,24,.20),0 10px 22px -8px rgba(33,29,24,.10);
  --shadow-1:var(--e2); --shadow-2:var(--e4);
  --dur:.18s; --ease:cubic-bezier(.2,.7,.2,1);
}
::selection{background:var(--c-clay-tint);color:var(--c-ink);}

/* =====================================================================
   COMPONENTS — merged from the design system onto the frozen class
   hooks. Buttons: ink-filled primary, hairline secondary, quiet ghost.
   Border-led cards. Tinted selected level. Green focus rings. The
   signature gap track (hairline line, round clay self + ink manager
   marks, green delta) lives here too.
   ===================================================================== */
.btn{font-family:var(--font-sans);font-size:15px;font-weight:var(--fw-medium);border-radius:var(--r-md);border:none;background:var(--c-surface);color:var(--c-ink);padding:11px 18px;min-height:44px;cursor:pointer;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);white-space:nowrap;text-decoration:none;box-shadow:0 2px 6px -1px rgba(33,29,24,.10),0 1px 2px rgba(33,29,24,.06);transition:background .18s ease,color .18s ease,transform .15s ease,box-shadow .15s ease;}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -6px rgba(33,29,24,.16),0 2px 6px rgba(33,29,24,.08);}
.btn:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px;}
.btn:active{transform:translateY(0) scale(.99);}
.btn[disabled]{opacity:.5;pointer-events:none;cursor:not-allowed;box-shadow:none;}
.btn--primary{background:var(--c-clay);color:#fff;box-shadow:0 2px 6px -1px rgba(188,93,56,.45),0 1px 2px rgba(33,29,24,.06);}
.btn--primary:hover{background:var(--c-clay-press);transform:translateY(-1px);box-shadow:0 8px 18px -6px rgba(188,93,56,.5),0 2px 6px rgba(33,29,24,.08);}
.btn--accent{background:var(--c-clay);color:#fff;box-shadow:0 2px 6px -1px rgba(188,93,56,.45),0 1px 2px rgba(33,29,24,.06);}
.btn--accent:hover{background:var(--c-clay-press);}
.btn--ghost{background:transparent;box-shadow:none;color:var(--c-muted);padding-left:var(--sp-3);padding-right:var(--sp-3);}
.btn--ghost:hover{background:var(--c-sunken);box-shadow:none;color:var(--c-ink);transform:none;}
.card{background:var(--c-surface);border:none;border-radius:var(--r-lg);padding:var(--sp-5);box-shadow:var(--e2);}
.level-option{display:block;width:100%;text-align:left;font:inherit;color:var(--c-ink);background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5);cursor:pointer;transition:border-color .15s ease,background .15s ease;}
.level-option + .level-option{margin-top:var(--sp-3);}
.level-option:hover{border-color:var(--c-muted);background:var(--c-paper-deep);}
.level-option:focus-visible{outline:2px solid var(--c-accent-deep);outline-offset:2px;}
.level-option--selected{border-color:var(--c-accent);background:var(--c-accent-tint);}
.level-option .lo-label{font-family:var(--font-display);font-weight:var(--fw-medium);font-size:17px;color:var(--c-ink);display:block;}
.level-option--selected .lo-label{color:var(--c-accent-deep);}
.level-option .lo-desc{color:var(--c-ink-70);font-size:15px;line-height:1.5;margin-top:var(--sp-1);display:block;}
.bar{position:relative;margin:var(--sp-5) 0 var(--sp-4);padding:20px 8px 8px;}
.bar__track{position:relative;height:2px;background:var(--c-line);border-radius:2px;}
.bar__tick{position:absolute;top:-3px;width:1px;height:8px;background:var(--c-line-soft);transform:translateX(-50%);}
.bar__delta{position:absolute;top:50%;height:8px;background:var(--c-gap);border-radius:4px;transform:translateY(-50%);transition:left .25s ease-out,width .25s ease-out;}
.pin--self,.pin--manager{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);z-index:2;font-size:0;}
.pin--self{background:var(--c-bg);border:3px solid var(--c-self);}
.pin--manager{background:var(--c-manager);border:3px solid var(--c-bg);box-shadow:0 0 0 1px var(--c-manager);}
.input{font-family:var(--font-sans);font-size:15px;color:var(--c-ink);background:var(--c-surface);border:none;border-radius:var(--r-md);padding:12px 14px;width:100%;min-height:44px;box-shadow:inset 0 0 0 1px var(--c-line),0 1px 2px rgba(33,29,24,.04);transition:box-shadow .15s ease;}
.input::placeholder{color:var(--c-muted);}
.input:focus-visible,.input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--c-clay),0 0 0 3px rgba(188,93,56,.18);}
textarea.input{resize:vertical;min-height:80px;line-height:var(--lh-normal);padding-top:10px;}
.field{display:block;margin-bottom:var(--sp-4);}
.field > span{display:block;font-size:13px;font-weight:var(--fw-medium);color:var(--c-ink-70);margin-bottom:var(--sp-2);letter-spacing:.01em;}
.empty{border:1px dashed var(--c-line);border-radius:var(--r-md);background:var(--c-surface);padding:var(--sp-8) var(--sp-6);text-align:center;color:var(--c-muted);}
.tag{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:12px;color:var(--c-ink-2);background:var(--c-surface);border:none;box-shadow:inset 0 0 0 1px var(--c-line);border-radius:var(--r-pill);padding:4px 11px;white-space:nowrap;letter-spacing:.01em;}
.tag--on{color:var(--c-clay-press);box-shadow:none;background:var(--c-clay-tint);}

/* =====================================================================
   APP LAYOUT — Stream A owns this section. Token references only.
   ===================================================================== */
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--c-bg);color:var(--c-ink);font-family:var(--font-sans);font-size:var(--fs-3);line-height:var(--lh-normal);-webkit-font-smoothing:antialiased;}
.shell{max-width:1140px;margin:0 auto;padding:var(--sp-5) var(--sp-4) var(--sp-8);}
.shell--narrow{max-width:640px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-6);}
.brand{display:flex;align-items:center;gap:var(--sp-3);font-family:var(--font-display);font-size:var(--fs-4);font-weight:var(--fw-medium);letter-spacing:-0.01em;}
.brand-word{display:flex;flex-direction:column;line-height:1.05;}
.brand small{font-family:var(--font-sans);font-size:11px;color:var(--c-muted);font-weight:var(--fw-regular);letter-spacing:.04em;text-transform:uppercase;}
.brand .mark{display:inline-flex;align-items:center;gap:4px;height:22px;}
.brand .mark i{display:block;width:3px;border-radius:2px;}
.brand .mark i.s{height:13px;background:var(--c-self);}
.brand .mark i.m{height:22px;background:var(--c-manager);}
.brand .mark i.gap{width:7px;height:0;background:transparent;border-bottom:2px solid var(--c-accent);}
.tabs{display:flex;gap:var(--sp-1);flex-wrap:wrap;}
.tabs .btn[aria-current="page"]{border-color:var(--c-accent);color:var(--c-accent-deep);}
h1{font-family:var(--font-display);font-weight:var(--fw-medium);letter-spacing:-0.015em;font-size:var(--fs-5);line-height:var(--lh-tight);margin:0 0 var(--sp-2);}
h2{font-family:var(--font-display);font-weight:var(--fw-medium);letter-spacing:-0.012em;font-size:var(--fs-4);line-height:var(--lh-tight);margin:0 0 var(--sp-2);}
h3{font-family:var(--font-display);font-weight:var(--fw-medium);font-size:18px;line-height:var(--lh-tight);margin:0 0 var(--sp-2);}
p{margin:0 0 var(--sp-3);}
.lede{color:var(--c-ink-70);font-size:17px;margin-bottom:var(--sp-5);max-width:62ch;}
.stack > * + *{margin-top:var(--sp-4);}
.row{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;}
.row--between{justify-content:space-between;}
.muted{color:var(--c-muted);}
.small{font-size:var(--fs-1);}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--sp-4);}
.choice-grid .card{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;}
.choice-grid .card:hover{transform:translateY(-2px);box-shadow:var(--e3);}
.person-row{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);padding:var(--sp-4) 0;border-bottom:1px solid var(--c-line-soft);flex-wrap:wrap;}
.person-row:last-child{border-bottom:none;}
.person-row .name{font-weight:var(--fw-medium);font-size:var(--fs-3);}
.home-stats{display:flex;gap:var(--sp-7);flex-wrap:wrap;margin:0 0 var(--sp-6);padding-bottom:var(--sp-5);border-bottom:1px solid var(--c-line);}
.home-stats .stat .n{font-family:var(--font-display);font-size:34px;font-weight:var(--fw-medium);line-height:1;}
.home-stats .stat .n.accent{color:var(--c-accent);}
.home-stats .stat .l{font-size:var(--fs-1);color:var(--c-muted);margin-top:var(--sp-1);letter-spacing:.03em;}
.who{display:flex;align-items:center;gap:var(--sp-3);min-width:0;}
.avatar{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--c-line);background:var(--c-paper-deep);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:var(--fw-medium);font-size:15px;color:var(--c-ink-70);}
.who .nm{font-weight:var(--fw-medium);font-size:var(--fs-3);display:block;}
.who .st{font-size:var(--fs-1);color:var(--c-muted);}
.who .st.go{color:var(--c-self);}
.mini-gaps{display:flex;gap:4px;align-items:center;flex:1;min-width:120px;max-width:240px;}
.mini-gap{height:7px;border-radius:4px;background:var(--c-line);flex:1;position:relative;overflow:hidden;}
.mini-gap>span{position:absolute;top:0;bottom:0;left:0;background:var(--c-gap);border-radius:4px;}
.mini-note{font-size:var(--fs-1);color:var(--c-muted);min-width:120px;}
.mini-note b{color:var(--c-accent);font-weight:var(--fw-medium);}
/* stepper progress: fills per ANSWERED dimension, live on pick (Torin, 2026-07-05) */
.rate-pbar{width:140px;height:4px;background:var(--c-paper-deep);border-radius:2px;overflow:hidden;}
.rate-pbar i{display:block;height:4px;background:var(--c-accent);border-radius:2px;transition:width .35s ease;}
.dots i{width:var(--sp-2);height:var(--sp-2);border-radius:var(--r-pill);background:var(--c-line);}
.dots i.on{background:var(--c-accent);}
.barhead{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-3);margin-bottom:var(--sp-4);}
.gapnotes{margin:calc(-1 * var(--sp-3)) 0 var(--sp-5);}
.gapnotes p{font-size:var(--fs-2);color:var(--c-muted);margin:0 0 var(--sp-1);}
.legend{display:flex;gap:var(--sp-4);align-items:center;color:var(--c-muted);font-size:var(--fs-1);margin-top:var(--sp-3);flex-wrap:wrap;}
/* score-over-time (H2) trend card */
.tg-card{margin-top:var(--sp-4);}
.tg-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-2);}
.tg-sub{margin:0 0 var(--sp-4);max-width:60ch;}
.tg-seg{display:inline-flex;border:1px solid var(--c-line);border-radius:var(--r-pill);overflow:hidden;background:var(--c-bg);}
.tg-segbtn{font-family:var(--font-sans);font-size:13px;font-weight:var(--fw-medium);color:var(--c-muted);background:transparent;border:0;padding:8px 14px;min-height:36px;cursor:pointer;transition:background .15s ease,color .15s ease;}
.tg-segbtn.on{background:var(--c-surface);color:var(--c-ink);box-shadow:inset 0 0 0 1px var(--c-line);}
.tg-segbtn:not(.on):hover{color:var(--c-ink);}
.tg-segbtn:focus-visible{outline:2px solid var(--c-gap);outline-offset:-2px;}
.tg-svg{display:block;width:100%;height:auto;}
.tg-grid{stroke:var(--c-line-soft);stroke-width:1;}
.tg-ylab,.tg-xlab{fill:var(--c-muted);font-family:var(--font-sans);font-size:10px;}
.tg-line{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;}
.tg-line.tg-self{stroke:var(--c-self);}
.tg-line.tg-mgr{stroke:var(--c-manager);}
.tg-dot.tg-self{fill:var(--c-bg);stroke:var(--c-self);stroke-width:2;}
.tg-dot.tg-mgr{fill:var(--c-manager);stroke:var(--c-bg);stroke-width:1.5;}
.tg-cap{color:var(--c-ink-70);font-size:var(--fs-2);margin:var(--sp-2) 0 0;}
.tg-dims{display:grid;grid-template-columns:1fr;gap:var(--sp-3) var(--sp-5);}
@media(min-width:560px){.tg-dims{grid-template-columns:1fr 1fr;}}
.tg-dim{display:flex;flex-direction:column;gap:2px;}
.tg-dim-name{font-size:var(--fs-2);font-weight:var(--fw-medium);color:var(--c-ink-70);}
.tg-legend{margin-top:var(--sp-4);}
.tg-key{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;}
.tg-key-self{background:var(--c-bg);border:3px solid var(--c-self);}
.tg-key-mgr{background:var(--c-manager);border:2px solid var(--c-bg);box-shadow:0 0 0 1px var(--c-manager);}
.matrix-wrap{overflow-x:auto;overflow-y:hidden;} /* pair x-overflow with explicit y per known CSS gotcha */
.matrix{width:100%;border-collapse:collapse;font-size:var(--fs-2);}
.matrix th,.matrix td{border:1px solid var(--c-line);padding:var(--sp-2) var(--sp-3);text-align:center;}
.matrix th{color:var(--c-muted);font-weight:var(--fw-medium);}
.matrix td:first-child,.matrix th:first-child{text-align:left;}
.matrix td:first-child{font-weight:var(--fw-medium);}
.rowlink,.linkname{cursor:pointer;color:var(--c-ink);background:none;border:none;font:inherit;font-weight:var(--fw-medium);padding:0;text-decoration:underline;text-decoration-color:var(--c-line);}
.rowlink:hover,.linkname:hover{text-decoration-color:var(--c-muted);}
.matrix th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
.matrix th.sortable:hover{color:var(--c-ink);}
.matrix th .arrow{font-size:var(--fs-1);margin-left:2px;}
.cellv{display:block;border-radius:var(--r-sm);padding:var(--sp-1) var(--sp-2);}
.banner{border:none;border-radius:var(--r-md);background:var(--c-sunken);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-5);display:flex;justify-content:space-between;gap:var(--sp-3);align-items:center;font-size:var(--fs-2);color:var(--c-ink-2);flex-wrap:wrap;}
.notice{border:none;border-radius:var(--r-md);background:var(--c-warn-tint);padding:var(--sp-4);color:var(--c-ink-2);font-size:var(--fs-2);margin-bottom:var(--sp-4);}
.notice b,.notice strong{color:var(--c-warn);}
.notice ul{margin:var(--sp-2) 0 0;padding-left:var(--sp-5);}
.toast{position:fixed;bottom:var(--sp-5);left:50%;transform:translateX(-50%);background:var(--c-surface);color:var(--c-ink);border:1px solid var(--c-line);border-radius:var(--r-pill);padding:var(--sp-2) var(--sp-5);box-shadow:var(--shadow-2);font-size:var(--fs-2);opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;max-width:90vw;}
.toast.show{opacity:1;}
.fixbar{position:fixed;left:50%;bottom:var(--sp-4);transform:translateX(-50%);z-index:20;width:calc(100% - var(--sp-6));max-width:560px;background:var(--c-surface);border:none;border-radius:var(--r-lg);box-shadow:var(--e4);padding:var(--sp-4) var(--sp-5);font-size:var(--fs-2);color:var(--c-ink-2);display:none;}
.fixbar.show{display:block;}
.fixbar b{color:var(--c-warn);}
.fixbar ul{margin:var(--sp-1) 0 0;padding-left:var(--sp-5);color:var(--c-muted);}
.rlevels{display:grid;gap:var(--sp-2);margin:0 0 var(--sp-5);}
.rlevel{padding:2px 0;font-size:var(--fs-2);}
.rlevel .who{font-weight:var(--fw-medium);display:inline-flex;align-items:center;gap:7px;}
.rlevel .who::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c-line);flex:none;}
.rlevel--self .who::before{background:var(--c-self);}
.rlevel--manager .who::before{background:var(--c-manager);}
.rlevel .desc{color:var(--c-muted);margin:2px 0 0;line-height:var(--lh-normal);}
.dropzone{border:2px dashed var(--c-line);border-radius:var(--r-lg);padding:var(--sp-6);text-align:center;color:var(--c-muted);cursor:pointer;}
.dropzone.drag{border-color:var(--c-accent);color:var(--c-ink);}
.footer-note{margin-top:var(--sp-7);text-align:center;color:var(--c-muted);font-size:var(--fs-1);}
.dimcard{margin-bottom:var(--sp-4);}
.dimcard .levels{margin-top:var(--sp-3);display:grid;gap:var(--sp-3);}
.lvlrow{display:grid;grid-template-columns:140px 1fr;gap:var(--sp-3);align-items:start;}
.steps{display:grid;gap:var(--sp-4);counter-reset:step;}
.steps .card{position:relative;padding-left:var(--sp-7);}
.steps .card::before{counter-increment:step;content:counter(step);position:absolute;left:var(--sp-4);top:var(--sp-5);width:var(--sp-5);height:var(--sp-5);display:flex;align-items:center;justify-content:center;border:1px solid var(--c-accent);color:var(--c-accent);border-radius:var(--r-pill);font-size:var(--fs-2);font-weight:var(--fw-bold);}
.importlog{margin-top:var(--sp-4);display:grid;gap:var(--sp-2);}
.importlog .ok{color:var(--c-success);font-size:var(--fs-2);}
.importlog .err{color:var(--c-warn);font-size:var(--fs-2);}
.divider{border:none;border-top:1px solid var(--c-line);margin:var(--sp-6) 0;}
.savednote{font-size:var(--fs-1);color:var(--c-muted);}
.rlevel .desc{color:var(--c-ink-70);}
.authoring-prompt{white-space:pre-wrap;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--c-ink-70);background:var(--c-bg);border:1px solid var(--c-line);border-radius:var(--r-sm);padding:var(--sp-3) var(--sp-4);max-height:230px;overflow:auto;}
.tmpl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--sp-3);}
.tmpl-card{cursor:pointer;border:1px solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface);padding:var(--sp-4);transition:border-color .15s ease,background .15s ease;}
.tmpl-card:hover{border-color:var(--c-accent);background:var(--c-paper-deep);}
.tmpl-card h3{margin:0 0 var(--sp-1);}
/* ---- Results redesign: gap ladder, focus cards, 1:1 prep ---- */
.res-summary{font-size:17px;color:var(--c-ink);margin:0 0 var(--sp-5);}
.res-summary b{font-weight:var(--fw-bold);}
.ladder-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--sp-2);}
.ladder-head h2{font-family:var(--font-display);font-weight:var(--fw-medium);margin:0;font-size:18px;}
.ladder{display:grid;gap:2px;}
.lrow{display:grid;grid-template-columns:minmax(110px,150px) 1fr 96px;align-items:center;gap:var(--sp-3);padding:var(--sp-2);border-radius:var(--r-sm);border:1px solid transparent;text-align:left;width:100%;background:none;font:inherit;color:inherit;cursor:pointer;}
.lrow:hover{background:var(--c-paper-deep);}
.lrow.focus{background:var(--c-accent-tint);border-color:var(--c-accent);}
.lrow:focus-visible{outline:2px solid var(--c-accent-deep);outline-offset:2px;}
.lrow .lname{font-size:var(--fs-2);font-weight:var(--fw-medium);color:var(--c-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ltrack{position:relative;height:6px;background:var(--c-line);border-radius:4px;}
.lrow.focus .ltrack{height:8px;}
.ltick{position:absolute;top:50%;width:1px;height:10px;background:var(--c-line-soft);transform:translate(-50%,-50%);}
.ldelta{position:absolute;top:50%;height:8px;background:var(--c-gap);border-radius:4px;transform:translateY(-50%);transition:left .25s ease-out,width .25s ease-out;}
.lrow.focus .ldelta{height:10px;}
.lpin{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);z-index:2;}
.lpin.self{background:var(--c-bg);border:3px solid var(--c-self);}
.lpin.mgr{background:var(--c-manager);border:3px solid var(--c-bg);box-shadow:0 0 0 1px var(--c-manager);}
.lgap{font-size:var(--fs-1);color:var(--c-muted);text-align:right;white-space:nowrap;}
.lgap.on{color:var(--c-accent-deep);font-weight:var(--fw-medium);}
.aligned-strip{margin-top:var(--sp-3);padding:var(--sp-3) var(--sp-4);border:1px dashed var(--c-line);border-radius:var(--r-md);color:var(--c-muted);font-size:var(--fs-2);}
.aligned-strip b{color:var(--c-ink-70);font-weight:var(--fw-medium);}
.focus-card{margin-top:var(--sp-4);border:1px solid var(--c-accent);border-radius:var(--r-md);background:var(--c-surface);padding:var(--sp-5);}
.focus-card .eyebrow{font-size:var(--fs-1);letter-spacing:.06em;text-transform:uppercase;color:var(--c-accent-deep);font-weight:var(--fw-bold);}
.focus-card h3{font-family:var(--font-display);font-weight:var(--fw-medium);margin:var(--sp-1) 0 var(--sp-1);font-size:21px;}
.focus-card .meaning{font-size:var(--fs-2);color:var(--c-ink-70);margin:0 0 var(--sp-4);}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);}
@media (max-width:560px){.twocol{grid-template-columns:1fr}}
.side{border-top:3px solid var(--c-line);padding-top:var(--sp-2);}
.side.self{border-color:var(--c-self);} .side.mgr{border-color:var(--c-manager);}
.side .who{font-weight:var(--fw-medium);font-size:var(--fs-2);}
.side .desc{color:var(--c-ink-70);font-size:var(--fs-2);margin:var(--sp-1) 0 0;line-height:1.5;}
.side .note{color:var(--c-muted);font-size:var(--fs-2);font-style:italic;margin:var(--sp-2) 0 0;}
.onereads{display:grid;gap:var(--sp-3);margin-top:var(--sp-4);}
.onereads .rd{background:var(--c-sunken);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);}
.onereads .rd .who{font-weight:var(--fw-medium);font-size:var(--fs-2);}
.onereads .rd .desc{color:var(--c-ink-70);font-size:var(--fs-2);margin:2px 0 0;}
/* 1:1 prep — the copy-prompt pattern extended into coaching */
.prep-cta{display:flex;gap:var(--sp-3);align-items:center;margin-top:var(--sp-2);flex-wrap:wrap;}
.prep-cta .hint{font-size:var(--fs-1);color:var(--c-muted);max-width:46ch;}
.btn--accent{background:var(--c-accent);color:var(--c-accent-ink);border-color:var(--c-accent);}
.btn--accent:hover{background:var(--c-accent-deep);border-color:var(--c-accent-deep);}
.promptcard{margin-top:var(--sp-4);border:1px solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface);padding:var(--sp-5);}
.promptcard .step{font-size:var(--fs-1);letter-spacing:.04em;text-transform:uppercase;color:var(--c-muted);font-weight:var(--fw-bold);margin-bottom:var(--sp-1);}
.prep-prompt{white-space:pre-wrap;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--c-ink-70);background:var(--c-bg);border:1px solid var(--c-line);border-radius:var(--r-sm);padding:var(--sp-3) var(--sp-4);max-height:220px;overflow:auto;margin-top:var(--sp-2);}
.prepnote{background:var(--c-sunken);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);margin-top:var(--sp-3);}
.prepnote .meta{font-size:var(--fs-1);color:var(--c-muted);}
.prepnote .body{font-size:var(--fs-2);color:var(--c-ink-70);white-space:pre-wrap;margin-top:2px;}
/* styled dialog — replaces native confirm on the rate gate (calm tone) */
.dialog-scrim{position:fixed;inset:0;background:rgba(33,28,20,.38);display:flex;align-items:center;justify-content:center;z-index:50;padding:var(--sp-5);}
.dialog{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);max-width:480px;width:100%;padding:var(--sp-5);}
.dialog h2{font-family:var(--font-display);font-weight:var(--fw-medium);margin:0 0 var(--sp-2);font-size:var(--fs-4);}
.dialog .dbody{color:var(--c-ink-70);font-size:var(--fs-2);line-height:1.55;}
.dialog .dbody ul{margin:var(--sp-2) 0 0;padding-left:var(--sp-5);}
.dialog .drow{display:flex;gap:var(--sp-2);justify-content:flex-end;margin-top:var(--sp-5);flex-wrap:wrap;}
details > summary{cursor:pointer;}
.promptcard > summary{list-style:none;}
.promptcard > summary::-webkit-details-marker{display:none;}
.aligned-strip > summary{color:var(--c-ink-70);}
@media (prefers-reduced-motion: reduce){.ldelta{transition:none;}}
.tmpl-card p{margin:0;color:var(--c-muted);font-size:var(--fs-2);}
@media (max-width:560px){ .lvlrow{grid-template-columns:1fr;} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition:none !important;animation:none !important;} }

/* ===================================================================
   LINEAR-LIGHT — merged Home (Pass 1, 2026-06-28)
   =================================================================== */
.shell--wide{max-width:1140px;}
/* top bar: a floating white card with an underline-active nav */
.topbar{background:var(--c-surface);border-radius:16px;box-shadow:var(--e2);padding:12px 20px;}
.brand small{letter-spacing:.06em;}
.topsep{width:1px;height:24px;background:var(--c-line);margin:0 var(--sp-4);}
.topnav{display:flex;align-items:center;gap:2px;flex-wrap:wrap;}
.toptab{position:relative;padding:7px 13px;font-family:var(--font-sans);font-weight:500;font-size:14px;color:var(--c-muted);background:none;border:none;cursor:pointer;border-radius:8px;}
.toptab:hover{color:var(--c-ink);}
.toptab[aria-current="page"]{font-weight:600;color:var(--c-ink);}
.toptab[aria-current="page"]::after{content:"";position:absolute;left:13px;right:13px;bottom:-12px;height:2px;border-radius:2px;background:var(--c-clay);}
.topright{display:flex;align-items:center;gap:var(--sp-3);}
/* page header + metric cards */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-5);flex-wrap:wrap;margin-bottom:var(--sp-5);}
.pagehead h1{margin:0 0 6px;}
.metrics{display:flex;gap:var(--sp-3);flex-wrap:wrap;}
.metric{background:var(--c-surface);border-radius:var(--r-lg);box-shadow:var(--e2);padding:14px 20px;text-align:center;min-width:96px;}
.metric .n{font-family:var(--font-display);font-size:30px;line-height:1;}
.metric .n.accent{color:var(--c-gap-deep);}
.metric .l{font-family:var(--font-sans);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-muted);margin-top:5px;}
/* roster header + add popover */
.roster-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);margin:var(--sp-6) 0 var(--sp-3);flex-wrap:wrap;}
.roster-head .rlabel{font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-muted);}
.rhright{display:flex;align-items:center;gap:var(--sp-5);flex-wrap:wrap;}
.roster-key{display:flex;gap:var(--sp-4);flex-wrap:wrap;}
.roster-key .k{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--c-muted);}
.roster-key .sw{width:12px;height:12px;border-radius:4px;flex:none;position:relative;}
.roster-key .sw--gap{background:var(--c-surface);box-shadow:inset 0 0 0 1px var(--c-line);}
.roster-key .sw--gap::after{content:"";position:absolute;right:2px;top:2px;bottom:2px;width:3px;border-radius:1px;background:var(--c-clay);}
.roster-key .sw--low{background:var(--c-sunken);box-shadow:inset 0 0 0 1px var(--c-line);}
.roster-key .sw--str{background:var(--c-gap-tint);box-shadow:inset 0 0 0 1px var(--c-gap);}
.roster-key .sw--str::after{content:"";position:absolute;inset:0;margin:auto;width:5px;height:5px;border-radius:50%;background:var(--c-gap-deep);}
.addrow{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;}
.addwrap{position:relative;}
.plusbtn{width:38px;height:38px;border-radius:var(--r-md);border:none;background:var(--c-surface);box-shadow:var(--e2);color:var(--c-ink);font-size:21px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s ease,box-shadow .15s ease;}
.plusbtn:hover{transform:translateY(-1px);box-shadow:var(--e3);}
.addpop{position:absolute;right:0;top:46px;width:264px;background:var(--c-surface);border-radius:var(--r-lg);box-shadow:var(--e4);padding:var(--sp-4);z-index:30;display:none;}
.addpop.open{display:block;}
.addblock{display:flex;flex-direction:column;gap:var(--sp-2);}
.addblock .input{width:100%;min-height:40px;padding:9px 12px;font-size:14px;}
.addfull{width:100%;}
.addhint{margin:4px 0 0;font-size:12px;color:var(--c-muted);line-height:1.45;}
.addsep{height:1px;background:var(--c-line);margin:var(--sp-4) 0;}
/* roster body */
.roster{background:var(--c-surface);border-radius:var(--r-2xl);box-shadow:var(--e3);padding:var(--sp-2) var(--sp-4) var(--sp-4);}
.squadhead{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-5) var(--sp-3) var(--sp-2);}
.squadhead .sq{font-family:var(--font-sans);font-weight:700;font-size:13px;color:var(--c-ink);}
.squadhead .ct{font-family:var(--font-mono);font-size:11px;color:var(--c-muted);}
.squadhead .ln{flex:1;height:1px;background:var(--c-line);}
.prow{display:grid;grid-template-columns:minmax(220px,1.1fr) 2fr auto;align-items:flex-start;gap:var(--sp-4);padding:14px var(--sp-3);border-radius:var(--r-lg);transition:background .15s ease;}
.prow + .prow{box-shadow:inset 0 1px 0 var(--c-sunken);}
.prow:hover{background:var(--c-bg);}
.prow.calm{opacity:.72;}
.prow.calm:hover{opacity:1;}
.prow .avatar{background:var(--c-clay-tint);color:var(--c-clay-press);border:none;}
.prow .who{align-items:flex-start;}
.prow .who .nm{line-height:1.25;}
.prow .who .role{font-size:12.5px;color:var(--c-muted);margin-top:5px;display:block;line-height:1.3;}
.prow .who .role b{color:var(--c-ink-2);font-weight:600;}
.pills{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:flex-start;padding-top:3px;}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;}
.pill .d{font-family:var(--font-mono);font-weight:500;font-size:11.5px;}
.pill--gap{background:var(--c-surface);box-shadow:inset 0 0 0 1px var(--c-line);color:var(--c-ink-2);}
.pill--gap .meter{display:inline-flex;gap:2px;align-items:flex-end;}
.pill--gap .meter i{width:3px;height:11px;border-radius:1px;background:var(--c-faint);display:block;}
.pill--gap .meter i.on{background:var(--c-clay);}
.pill--low{background:var(--c-sunken);color:var(--c-ink-2);}
.pill--low .d{color:var(--c-muted);}
.pill--strength{background:var(--c-gap-tint);color:var(--c-gap-deep);font-weight:600;}
.pill--strength svg{width:13px;height:13px;}
.pprompt{font-size:13.5px;color:var(--c-ink-2);}
.pprompt b{color:var(--c-clay-press);}
.pprompt.muted{color:var(--c-muted);}
.racts{display:flex;align-items:center;gap:2px;justify-self:end;}
.iconbtn{width:34px;height:34px;border-radius:var(--r-md);border:none;background:transparent;color:var(--c-ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;}
.iconbtn:hover{background:var(--c-sunken);color:var(--c-ink);}
.iconbtn--accent:hover{background:var(--c-clay-tint);color:var(--c-clay-press);}
.iconbtn svg{width:18px;height:18px;display:block;}
/* demoted, flipped matrix */
.mtx-sec{margin-top:var(--sp-6);}
.mtx-toggle{display:flex;align-items:center;gap:var(--sp-3);width:100%;background:none;border:none;cursor:pointer;padding:var(--sp-2) 0;text-align:left;}
.mtx-toggle .rlabel{font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-muted);}
.mtx-toggle .sub{font-size:13px;color:var(--c-muted);}
.mtx-toggle .chev{margin-left:auto;color:var(--c-muted);transition:transform .2s ease;display:inline-flex;}
.mtx-toggle[aria-expanded="true"] .chev{transform:rotate(90deg);}
.mtx-body{margin-top:var(--sp-3);}
.mtx-controls{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-4);flex-wrap:wrap;}
.seg{display:inline-flex;background:var(--c-sunken);border-radius:var(--r-md);padding:3px;gap:3px;}
.seg button{font-family:var(--font-sans);font-weight:600;font-size:13px;border:none;background:transparent;color:var(--c-ink-2);padding:7px 13px;border-radius:8px;cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--c-surface);color:var(--c-ink);box-shadow:var(--e1);}
.mtx-card{background:var(--c-surface);border-radius:var(--r-xl);box-shadow:var(--e3);padding:6px 18px 16px;overflow-x:auto;overflow-y:hidden;}
table.mtx{border-collapse:collapse;width:100%;min-width:520px;}
table.mtx th,table.mtx td{padding:10px 8px;text-align:center;}
table.mtx thead th{font-family:var(--font-sans);font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--c-muted);border-bottom:1px solid var(--c-sunken);vertical-align:bottom;}
table.mtx tbody th{text-align:left;font-family:var(--font-display);font-weight:400;font-size:15px;color:var(--c-ink);white-space:nowrap;padding-left:2px;}
table.mtx tbody tr + tr th,table.mtx tbody tr + tr td{border-top:1px solid var(--c-sunken);}
.mtx .pcol{display:flex;flex-direction:column;align-items:center;gap:5px;}
.mtx .pcol .pav{width:28px;height:28px;border-radius:50%;background:var(--c-clay-tint);color:var(--c-clay-press);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:11px;}
.mtx .pcol span{font-size:11px;color:var(--c-ink-2);font-weight:600;}
table.mtx thead th.bestcol{color:var(--c-muted);}
.mtx td .cv,.mtx td > .cv{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;border-radius:var(--r-pill);font-family:var(--font-mono);font-size:12px;font-weight:500;padding:0 8px;}
.mtx td .cv.dash{color:var(--c-faint);background:none;}
.mtx-key{display:flex;gap:var(--sp-4);flex-wrap:wrap;align-items:center;margin:0 2px var(--sp-3);}
.mtx-key .mk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--c-ink-2);}
.mtx-key .mkscale{display:inline-flex;gap:2px;}
.mtx-key .mkscale i{width:13px;height:13px;border-radius:3px;display:block;}
.mtx-key .mkdash{color:var(--c-faint);font-weight:600;}
.mtx-legend{font-size:12.5px;color:var(--c-muted);margin:var(--sp-3) 2px 0;line-height:1.6;}
.racts{padding-top:2px;}
/* =====================================================================
   MULTI-ROLE RUBRIC EDITOR (two-column master-detail) + share/re-build
   modals. Ported from docs/rubric-redesign-mock-2026-06-29.html onto the
   real token set: the mock's --r-ctl/--r-card map to --r-md/--r-lg, and the
   mock's green --c-accent renders as this app's clay automatically (same
   token name). Reuses .btn/.input/.tag/.card/.seg; adds only the structure
   below. New button variants compose on top of .btn.
   ===================================================================== */
.btn--sm{min-height:38px;padding:9px 14px;font-size:14px;}
.btn--danger{color:var(--c-warn);background:var(--c-surface);}
.btn--danger:hover{background:var(--c-warn);color:#fff;}
/* a select styled to match the text inputs: custom chevron with the same 14px
   right inset as .input padding, instead of the cramped native OS arrow */
.select-ctl{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%23847B6C' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:38px;}

/* editor header: role picker + level lens + actions */
.wg-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5);flex-wrap:wrap;margin-bottom:var(--sp-5);}
.headcol{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.headcol .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);font-weight:var(--fw-medium);}
.wg-head__right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.wg-head__rightrow{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;}
.wg-head__actions{display:flex;align-items:center;gap:var(--sp-2);}
.wg-head__actions .btn svg{width:16px;height:16px;flex:none;}
/* editor-header icon buttons read as raised buttons (not flat on the card) */
.wg-head__actions .iconbtn{width:38px;height:38px;background:var(--c-surface);box-shadow:0 2px 6px -1px rgba(33,29,24,.10),0 1px 2px rgba(33,29,24,.06);transition:background .18s,color .18s,transform .15s,box-shadow .15s;}
.wg-head__actions .iconbtn:hover{background:var(--c-surface);transform:translateY(-1px);box-shadow:0 8px 18px -6px rgba(33,29,24,.16),0 2px 6px rgba(33,29,24,.08);}
.wg-head__right .vdiv{width:1px;height:26px;background:var(--c-line);flex:none;}
.level-mini{display:flex;align-items:center;gap:var(--sp-2);}
.level-mini__lbl{font-size:12px;color:var(--c-muted);font-weight:var(--fw-medium);}

/* role picker dropdown */
.rolepick{position:relative;}
.rolepick__btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:transparent;border:0;padding:0;cursor:pointer;text-align:left;}
.rolepick__title{display:flex;align-items:center;gap:var(--sp-2);}
.rolepick__btn:hover .rolepick__name{color:var(--c-accent-deep);}
.rolepick__name{font-family:var(--font-display);font-size:24px;font-weight:var(--fw-medium);letter-spacing:-0.01em;line-height:1.1;color:var(--c-ink);}
.rolepick__sub{font-size:12px;color:var(--c-muted);}
.caret{width:9px;height:9px;border-right:2px solid var(--c-muted);border-bottom:2px solid var(--c-muted);transform:rotate(45deg);transition:transform .18s;}
.rolepick__btn[aria-expanded="true"] .caret{transform:rotate(-135deg);}
.rolepick__menu{position:absolute;top:calc(100% + 6px);left:0;min-width:290px;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md);box-shadow:var(--shadow-2);padding:var(--sp-2);z-index:30;display:none;}
.rolepick__menu.open{display:block;}
.roleitem{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);width:100%;text-align:left;background:transparent;border:0;border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;font:inherit;color:var(--c-ink);}
.roleitem:hover{background:var(--c-accent-tint);}
.roleitem__meta{font-size:12px;color:var(--c-muted);}
.roleitem--on{background:var(--c-accent-tint);}
.roleitem--on .roleitem__name{color:var(--c-accent-deep);font-weight:var(--fw-medium);}
.roleitem__name{display:flex;align-items:center;gap:var(--sp-2);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c-accent);}
.rolepick__menu hr{border:0;border-top:1px solid var(--c-line-soft);margin:var(--sp-2) 4px;}
.roleadd{color:var(--c-accent-deep);font-weight:var(--fw-medium);}

/* two-column body */
.md-grid{display:grid;grid-template-columns:264px 1fr;gap:var(--sp-5);align-items:start;}
.col-cap{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);font-weight:var(--fw-medium);margin:0 0 var(--sp-2);padding:0 var(--sp-2);}
.dim-list{display:flex;flex-direction:column;gap:var(--sp-1);max-height:560px;overflow:auto;padding-right:4px;}
.dim-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--r-md);padding:11px 12px;cursor:pointer;font:inherit;color:var(--c-ink);transition:background .14s,border-color .14s;}
.dim-row:hover{background:var(--c-paper-deep);}
.dim-row--on{background:var(--c-accent-tint);border-color:var(--c-accent);}
.dim-row__name{font-size:15px;font-weight:var(--fw-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dim-row--on .dim-row__name{color:var(--c-accent-deep);}
.dim-row__exp{flex:none;font-size:11px;color:var(--c-muted);border:1px solid var(--c-line);border-radius:var(--r-md);padding:3px 9px;background:var(--c-surface);white-space:nowrap;}
.dim-row--on .dim-row__exp{border-color:var(--c-accent);color:var(--c-accent-deep);}
.dim-row__warn{color:var(--c-warn);border-color:var(--c-warn);}
.dim-addrow{margin-top:var(--sp-2);}

/* right: detail editor */
.detail{background:var(--c-bg);border:1px solid var(--c-line-soft);border-radius:var(--r-lg);padding:var(--sp-5);min-width:0;}
.detail__head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-4);margin-bottom:var(--sp-4);}
.field-lbl{display:block;font-size:12px;font-weight:var(--fw-medium);color:var(--c-ink-70);margin:0 0 6px;}
.name-input{font-family:var(--font-display);font-size:22px;font-weight:var(--fw-medium);letter-spacing:-0.01em;padding:6px 10px;background:transparent;border:1px solid transparent;border-radius:var(--r-md);width:100%;color:var(--c-ink);}
.name-input:hover{border-color:var(--c-line);}
.name-input:focus{outline:2px solid var(--c-accent-deep);outline-offset:1px;background:var(--c-surface);}
.detail textarea.input{min-height:48px;resize:vertical;line-height:1.5;background:var(--c-bg);}
.lvls-cap{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);margin:var(--sp-5) 0 var(--sp-2);flex-wrap:wrap;}
.lvls-cap h4{margin:0;font-family:var(--font-sans);font-size:13px;font-weight:var(--fw-medium);color:var(--c-ink);}
.lvls-cap .hint{font-size:12px;color:var(--c-muted);}
.lvl-row{border:1px solid var(--c-line);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);margin-top:var(--sp-2);background:var(--c-surface);}
.lvl-row--expected{border-color:var(--c-accent);background:var(--c-accent-tint);}
.lvl-row__head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-bottom:8px;}
.lvl-row__num{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--c-muted);font-weight:var(--fw-medium);}
.lvl-row--expected .lvl-row__num{color:var(--c-accent-deep);}
.lvl-row--expected textarea.input{background:var(--c-surface);}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:var(--fw-medium);color:var(--c-muted);background:transparent;border:1px solid var(--c-line);border-radius:var(--r-md);padding:5px 10px;cursor:pointer;}
.flag:hover{border-color:var(--c-accent);color:var(--c-accent-deep);}
.flag__dot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;}
.flag--on{color:var(--c-accent-deep);border-color:var(--c-accent);background:var(--c-surface);}
.flag--on .flag__dot{background:var(--c-accent);border-color:var(--c-accent);}

/* editor footer */
.wg-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);border-top:1px solid var(--c-line);margin-top:var(--sp-5);padding-top:var(--sp-4);flex-wrap:wrap;}
.wg-foot__meta{font-size:12px;color:var(--c-muted);display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;}
.wg-foot__actions{display:flex;align-items:center;gap:var(--sp-2);}

/* share + re-build modals */
.modal-overlay{position:fixed;inset:0;background:rgba(33,28,20,.42);display:flex;align-items:flex-start;justify-content:center;padding:var(--sp-7) var(--sp-4);z-index:100;overflow:auto;}
.modal{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);width:100%;max-width:560px;padding:var(--sp-5);}
.modal--wide{max-width:640px;}
.modal__head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);}
.modal__title{font-family:var(--font-display);font-size:22px;font-weight:var(--fw-medium);letter-spacing:-0.01em;margin:0;}
.iconx{flex:none;width:34px;height:34px;border-radius:var(--r-md);border:1px solid transparent;background:transparent;color:var(--c-muted);font-size:20px;line-height:1;cursor:pointer;}
.iconx:hover{background:var(--c-paper-deep);color:var(--c-ink);}
.modal__sub{font-size:13px;color:var(--c-ink-70);line-height:1.55;margin:var(--sp-2) 0 var(--sp-4);}
.modal__from{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;}
.modal__foot{display:flex;justify-content:flex-end;gap:var(--sp-2);margin-top:var(--sp-5);}
.previewlink{font-size:13px;color:var(--c-accent-deep);font-weight:var(--fw-medium);cursor:pointer;}
.previewlink:hover{text-decoration:underline;}
.rcpt-list{display:flex;flex-direction:column;gap:var(--sp-2);}
.rcpt{display:flex;align-items:center;gap:var(--sp-3);background:var(--c-bg);border:1px solid var(--c-line-soft);border-radius:var(--r-md);padding:9px 12px;}
.rcpt__who{display:flex;flex-direction:column;min-width:92px;}
.rcpt__name{font-size:14px;font-weight:var(--fw-medium);}
.rcpt__file{font-size:11px;color:var(--c-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;}
.rcpt__email{flex:1;min-width:0;}
.shareother{margin-top:var(--sp-4);border-top:1px solid var(--c-line-soft);padding-top:var(--sp-3);}
.shareother summary{font-size:13px;font-weight:var(--fw-medium);color:var(--c-ink-70);cursor:pointer;}
.steps-mini{margin:var(--sp-2) 0 0;padding-left:18px;color:var(--c-ink-70);font-size:13px;line-height:1.6;}
.teamprev{margin-bottom:var(--sp-4);}
.teamprev summary{font-size:13px;font-weight:var(--fw-medium);color:var(--c-accent-deep);cursor:pointer;}
.teamprev__card{margin-top:var(--sp-2);background:var(--c-bg);border:1px solid var(--c-line-soft);border-radius:var(--r-md);padding:var(--sp-4);}
.teamprev__hi{font-family:var(--font-display);font-size:18px;font-weight:var(--fw-medium);margin:0 0 4px;}
.teamprev__lede{font-size:13px;color:var(--c-ink-70);margin:0 0 var(--sp-3);}
.teamprev__steps{display:flex;flex-direction:column;gap:var(--sp-2);}
.teamprev__steps div{display:flex;flex-direction:column;gap:2px;}
.teamprev__steps strong{font-size:12px;font-weight:var(--fw-medium);color:var(--c-ink);}
.teamprev__steps span{font-size:12px;color:var(--c-muted);line-height:1.5;}
.rb-scope{margin-bottom:var(--sp-4);}
.rb-chips{display:flex;gap:var(--sp-2);margin-top:var(--sp-2);flex-wrap:wrap;}
.rb-chip{font-size:13px;font-weight:var(--fw-medium);color:var(--c-ink-70);background:transparent;border:1px solid var(--c-line);border-radius:var(--r-md);padding:7px 13px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
.rb-chip:hover{background:var(--c-paper-deep);}
.rb-chip--on{background:var(--c-accent-tint);color:var(--c-accent-deep);border-color:var(--c-accent);}
.rb-warn{background:var(--c-warn-tint);border:1px solid var(--c-warn);border-radius:var(--r-md);color:var(--c-warn);padding:10px 14px;font-size:13px;line-height:1.5;margin-bottom:var(--sp-3);}
.rb-step{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-top:var(--sp-4);}
.rb-prompt{background:var(--c-bg);border:1px solid var(--c-line-soft);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--c-ink-70);white-space:pre-wrap;line-height:1.55;max-height:170px;overflow:auto;margin-top:var(--sp-2);}

/* editor responsive */
@media (max-width:880px){
  .md-grid{grid-template-columns:1fr;}
  .dim-list{max-height:none;}
  .wg-head{align-items:flex-start;}
  .wg-head__right .vdiv{display:none;}
  .wg-foot{flex-direction:column;align-items:stretch;}
  .wg-foot__actions{flex-direction:column-reverse;}
  .wg-foot__actions .btn{width:100%;}
}
/* ---------- demo mode chrome (onboarding spec §2.2) ---------- */
body.demo-mode{box-shadow:inset 0 0 0 3px var(--c-accent);min-height:100vh;}
.demo-label{position:fixed;top:3px;left:50%;transform:translateX(-50%);z-index:80;background:var(--c-surface);border:2px solid var(--c-accent);border-radius:999px;padding:2px 14px;font-weight:700;font-size:var(--fs-2);color:var(--c-accent);}
/* demo tour — dim + spotlight, uniform hairline card (no accent edge stripes) */
.tour-scrim{position:fixed;inset:0;background:rgba(33,28,20,.38);z-index:60;}
.tour-hero{position:relative;z-index:61;background:var(--c-surface);border-radius:var(--r-md);box-shadow:0 0 0 2px var(--c-accent),0 10px 30px rgba(188,93,56,.18);}
.tour-card{position:fixed;z-index:62;max-width:400px;width:calc(100% - 2*var(--sp-4));background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);padding:var(--sp-4);box-shadow:0 12px 34px rgba(33,28,20,.2);animation:tour-in .25s ease-out;}
.tour-step{display:block;font-size:var(--fs-1);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--c-accent);}
.tour-card h3{margin:4px 0 6px;font-size:var(--fs-3);}
.tour-card p{margin:0 0 var(--sp-3);font-size:var(--fs-2);color:var(--c-ink-70);}
.tour-cta{display:flex;align-items:center;gap:var(--sp-2);}
.tour-x{position:absolute;top:var(--sp-2);right:var(--sp-2);}
.tour-fig{float:right;width:40px;margin:0 0 var(--sp-1) var(--sp-2);}
.tour-fig svg{display:block;width:100%;height:auto;}
@keyframes tour-in{from{opacity:0}to{opacity:1}} /* opacity-only: the card's inline transform centers the anchorless fallback */
/* ---------- onboarding wizard shell (spec §3) ---------- */
.wiz{max-width:860px;margin:0 auto;padding:var(--sp-5) var(--sp-4) 96px;}
.wiz-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);padding:var(--sp-3) 0;border-bottom:1px solid var(--c-line);}
.wiz-steps{display:flex;align-items:flex-start;gap:var(--sp-2);}
.wiz-step{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;background:none;border:0;font:inherit;font-size:var(--fs-2);cursor:default;color:var(--c-muted);padding:0;}
.wiz-step[data-state="done"]{cursor:pointer;color:var(--c-ink);}
.wiz-dot{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--c-line);font-size:var(--fs-2);}
.wiz-step[data-state="current"] .wiz-dot{background:var(--c-accent);color:#fff;border-color:var(--c-accent);}
.wiz-step[data-state="done"] .wiz-dot{background:var(--c-paper-deep);border-color:var(--c-accent);color:var(--c-accent);animation:wiz-pop .25s ease;}
.wiz-foot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:var(--sp-3) var(--sp-5);background:var(--c-surface);border-top:1px solid var(--c-line);z-index:40;}
.wiz-body{animation:wiz-in .22s ease-out;}
.wiz-body.wiz-back{animation:wiz-in-back .22s ease-out;}
.wiz-err{color:#a33;font-size:var(--fs-2);margin:var(--sp-1) 0 0;}
@keyframes wiz-in{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes wiz-in-back{from{transform:translateX(-48px);opacity:0}to{transform:none;opacity:1}}
@keyframes wiz-pop{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.wiz-body,.wiz-body.wiz-back,.wiz-step[data-state="done"] .wiz-dot{animation:none;}}
@media (max-width:560px){.wiz-steps{min-width:0}.wiz-step{min-width:44px}.wiz-step small{display:none}}
/* step-3 option row: all three choices on one line; the panel below carries
   the SELECTED option's working detail (every option, not just Claude) */
.wiz-opt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2);}
.wiz-opt-grid .tmpl-card{padding:var(--sp-3);}
.wiz-opt-grid .tmpl-card h3{font-size:var(--fs-2);}
.wiz-opt-grid .tmpl-card p{font-size:var(--fs-1);}
.wiz-detail{border:1px solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface);padding:var(--sp-3) var(--sp-4);margin-top:var(--sp-2);}
.wiz-prompt{background:var(--c-paper-deep);border:1px solid var(--c-line);border-radius:var(--r-sm);padding:var(--sp-3);font-size:var(--fs-1);line-height:1.5;white-space:pre-wrap;max-height:180px;overflow:auto;margin:0 0 var(--sp-2);}
.wiz-mdrow{display:flex;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-2);}
.wiz-mdrow .input{flex:1;}
@media (max-width:720px){.wiz-opt-grid{grid-template-columns:1fr;}}
/* ---------- embedded illustrations (Humaaans, recolored — spec §7.3) ----------
   Wizard figures are ANCHORED, not floated: steps 1 & 3 get a two-column body
   with the figure grounding a tinted right rail; dense steps 2 & 4 get none
   (design critique 2026-07-02, issue #1). */
.wiz-body--rail{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:var(--sp-6);align-items:stretch;}
.wiz-rail{background:var(--c-accent-tint);border-radius:var(--r-xl);min-height:300px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;pointer-events:none;user-select:none;}
.wiz-rail-fig{width:200px;margin-bottom:-8px;}
.wiz-rail-fig svg{display:block;width:100%;height:auto;}
.roster-empty{text-align:center;padding:var(--sp-5) var(--sp-4);}
.roster-empty-illo{width:172px;margin:0 auto var(--sp-3);}
.roster-empty-illo svg{display:block;width:100%;height:auto;}
.roster-empty p{margin:0;max-width:340px;margin-inline:auto;}
/* living team strip (Torin, 2026-07-05): one figure per named teammate, plants
   grounding the corner. Figures idle-sway; the first greets every ~12s. */
.team-strip{position:relative;height:150px;margin:var(--sp-2) 0 var(--sp-3);overflow:hidden;border-bottom:1px solid var(--c-line);}
.team-strip .ts-plants{position:absolute;right:-26px;bottom:-28px;width:240px;opacity:.9;pointer-events:none;}
.team-strip .ts-plants svg{display:block;width:100%;height:auto;}
.ts-figs{position:absolute;left:var(--sp-2);right:130px;bottom:-5px;display:flex;align-items:flex-end;}
.ts-fig{width:78px;margin-right:-14px;transform-origin:50% 100%;animation:ts-sway 5.6s ease-in-out infinite alternate;}
.ts-fig svg{display:block;width:100%;height:auto;}
.ts-fig:nth-child(2n){animation-duration:6.4s;animation-delay:-2s;}
.ts-fig:nth-child(3n){animation-duration:7.1s;animation-delay:-4s;}
.ts-fig:first-child{animation-name:ts-sway,ts-greet;animation-duration:5.6s,12s;animation-iteration-count:infinite,infinite;animation-direction:alternate,normal;}
.ts-more{align-self:flex-end;margin:0 0 12px 22px;background:var(--c-paper-deep);color:var(--c-ink-70);font-size:var(--fs-1);font-weight:600;padding:3px 10px;border-radius:var(--r-pill);}
@keyframes ts-sway{from{transform:rotate(-1.1deg)}to{transform:rotate(1.2deg)}}
@keyframes ts-greet{0%,92%,100%{translate:0 0}94%{translate:0 -6px}97%{translate:0 -1px}}
@media (max-width:720px){.team-strip{height:110px}.team-strip .ts-plants{width:170px}.ts-fig{width:62px}}
@media (max-width:900px){.wiz-body--rail{grid-template-columns:1fr;}.wiz-rail{display:none;}}
/* ---------- teammate detail modal (TypeUI two-pane spec; see
   docs/superpowers/specs/2026-06-30-teammate-detail-modal-reference.md) ----------
   Metrics locked: buttons 16px L/R + 10px T/B; inputs 12px H / 10px V;
   textarea 14px all sides; field fill = dialog surface nudged one step
   (surface is pure white here, so the nudge goes toward the page cream). */
.tmodal{max-width:860px;width:100%;background:var(--c-surface);border-radius:var(--r-lg);padding:var(--sp-5);box-shadow:0 12px 40px rgba(33,28,20,.22);}
.tm-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--c-line);padding-bottom:var(--sp-3);margin-bottom:var(--sp-4);}
.tm-head h3{margin:0;}
.tm-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5);align-items:start;}
.tmodal .input{background:var(--c-bg);padding:10px 12px;}
.tmodal textarea.input{padding:14px;min-height:96px;}
.tmodal .btn{padding:10px 16px;}
.tmodal .iconbtn{padding:6px;}
.tm-rolecards{display:flex;gap:var(--sp-2);flex-wrap:wrap;}
.tm-rolecard{position:relative;flex:1;min-width:130px;border:1px solid var(--c-line);border-radius:var(--r-md);background:var(--c-bg);padding:var(--sp-3);cursor:pointer;text-align:left;font:inherit;}
.tm-rolecard[aria-checked="true"]{border-color:var(--c-accent);background:var(--c-accent-tint);}
.tm-rolecard .tm-radio{position:absolute;top:8px;right:8px;width:14px;height:14px;border-radius:50%;border:2px solid var(--c-line);}
.tm-rolecard[aria-checked="true"] .tm-radio{border-color:var(--c-accent);background:var(--c-accent);}
.tm-rolecard b{display:block;font-size:var(--fs-2);}
.tm-rolecard span{font-size:var(--fs-1);color:var(--c-muted);}
.tm-levels{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center;}
.tm-levels label{display:inline-flex;gap:4px;align-items:center;font-size:var(--fs-2);}
.tm-foot{display:flex;gap:var(--sp-3);border-top:1px solid var(--c-line);padding-top:var(--sp-4);margin-top:var(--sp-5);}
.tm-foot .tm-close{margin-left:auto;}
@media (max-width:560px){
  .tm-grid{grid-template-columns:1fr;}
  .tm-rolecards{flex-direction:column;}
  .tm-foot{flex-direction:column;}
  .tm-foot .btn{width:100%;}
  .tm-foot .tm-close{margin-left:0;}
}
/* completion screen */
.wiz-done{max-width:640px;margin:6vh auto 0;text-align:left;position:relative;padding:var(--sp-6) 170px var(--sp-6) var(--sp-4);}
.wiz-done-illo{position:absolute;right:0;bottom:var(--sp-5);width:150px;}
.wiz-done-illo svg{display:block;width:100%;height:auto;}
.wd-sum{font-size:var(--fs-2);color:var(--c-ink-70);margin:0 0 var(--sp-4);}
.wd-sum b{color:var(--c-ink);}
.wd-roster{border:1px solid var(--c-line);border-radius:var(--r-lg);overflow:hidden;margin:0 0 var(--sp-4);background:var(--c-surface);}
