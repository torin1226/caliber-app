/* ---------- render ---------- */
function render() {
  /* the demo tour anchors live DOM nodes, and the spotlighted row's own
     buttons can navigate — any re-render detaches the anchors, so end the
     tour instead of orphaning the scrim. Beat transitions swap card content
     WITHOUT render(), and boot shows the tour after the first render. */
  if (typeof demoTour !== 'undefined' && demoTour) demoTourEnd();
  document.body.classList.toggle('demo-mode', !!demoMode);
  var fn = views[route.view] || views.home;
  appEl.innerHTML = fn();
  var wire = wires[route.view];
  if (wire) wire();
  refreshFixbar();
}

/* Demo tour: first demo load only (spec §2.2, reworked per design critique
   2026-07-02 issue #2). Two beats: (1) spotlight one REAL gap row in the demo
   data and say what the product does — the gap is the conversation; (2) how
   answers arrive, then the handoff. Lives outside appEl; skippable everywhere
   (X, Skip, Esc, scrim click); runs once, ever. No auto-dismiss — it waits. */
var demoTour = null; /* {hero} while active */
function demoTourEnd() {
  if (!demoTour) return;
  var s = document.querySelector('.tour-scrim'); if (s) s.remove();
  var c = document.querySelector('.tour-card'); if (c) c.remove();
  if (demoTour.hero) demoTour.hero.classList.remove('tour-hero');
  document.removeEventListener('keydown', demoTourKey);
  demoTour = null;
}
function demoTourKey(e) { if (e.key === 'Escape') demoTourEnd(); }
function demoTourShow(anchor, html) {
  var card = document.querySelector('.tour-card');
  if (!card) {
    card = document.createElement('div');
    card.className = 'tour-card';
    card.setAttribute('role', 'dialog');
    card.setAttribute('aria-label', 'Demo tour');
    document.body.appendChild(card);
  }
  card.innerHTML = html;
  if (demoTour.hero) demoTour.hero.classList.remove('tour-hero');
  demoTour.hero = anchor || null;
  if (anchor) {
    anchor.classList.add('tour-hero');
    var r = anchor.getBoundingClientRect();
    card.style.transform = 'none';
    card.style.top = Math.max(16, Math.min(r.bottom + 10, window.innerHeight - card.offsetHeight - 16)) + 'px';
    card.style.left = Math.max(16, Math.min(r.left + 40, window.innerWidth - card.offsetWidth - 16)) + 'px';
  } else {
    card.style.top = '28vh'; card.style.left = '50%'; card.style.transform = 'translateX(-50%)';
  }
}
function demoTourClose() {
  return '<button class="iconbtn tour-x" data-action="tourSkip" aria-label="Dismiss tour">&#10005;</button>';
}
function showDemoTour() {
  if (demoTour) return;
  demoTour = { hero: null };
  var scrim = document.createElement('div');
  scrim.className = 'tour-scrim';
  scrim.addEventListener('click', demoTourEnd);
  document.body.appendChild(scrim);
  document.addEventListener('keydown', demoTourKey);
  /* beat 1 anchors on the first row with a real gap pill; if the demo data
     happens to have none, fall straight through to the handoff beat */
  var hero = [].slice.call(document.querySelectorAll('.prow')).filter(function (r) {
    return r.querySelector('.pill--gap');
  })[0];

    '<h3>This is the product</h3>' +
    '<p>You and ' + esc(name) + ' are ' + esc(delta) + ' level' + (delta === '1' ? '' : 's') + ' apart on ' + esc(dim) +
    '. That gap is a 1:1 waiting to happen — Caliber finds these for you.</p>' +
    '<div class="tour-cta"><button class="btn btn--primary btn--sm" data-action="tourNext">Next</button>' +
    '<button class="btn btn--ghost btn--sm" data-action="tourSkip">Skip</button></div>');
}

/* Floating fix-it bar: stays pinned while you scroll and fix the rubric,
   instead of a notice stuck at the top you can't see (test feedback B4).
   Lives outside appEl so it survives the editor's debounced re-saves. */
function refreshFixbar() {

  if (!bar) { bar = document.createElement('div'); bar.className = 'fixbar'; document.body.appendChild(bar); }
  var errs = route.view === 'rubric' ? Core.validateRubric(activeRubric()) : [];

/* ---------- per-view wiring (things delegation can't do) ---------- */
var wires = {};
/* completion confetti — plays once, right after Send and finish (spec §7.2) */
wires.onboardDone = function () {
  if (!wizJustFinished) return;
  wizJustFinished = false;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('wizConfetti');
  if (!cv) return;
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  var ctx = cv.getContext('2d');
  var colors = ['#BC5D38', '#9F4A29', '#F7E7DD', '#211D18', '#948C81'];
  var bits = [];
  for (var i = 0; i < 90; i++) {
    bits.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.4,
      w: 5 + Math.random() * 5, h: 8 + Math.random() * 6,
      vy: 2.2 + Math.random() * 3, vx: -1 + Math.random() * 2,
      rot: Math.random() * Math.PI, vr: -0.12 + Math.random() * 0.24,
      c: colors[i % colors.length] });
  }
  var start = null;
  function tick(ts) {
    if (!start) start = ts;
    if (!document.getElementById('wizConfetti')) return; /* view changed */
    ctx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(function (b) {
      b.y += b.vy; b.x += b.vx; b.rot += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    });
    if (ts - start < 2600) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  }
  requestAnimationFrame(tick);
};
wires.data = function () {
  var dz = document.getElementById('dropzone');
  var fi = document.getElementById('fileInput');
  if (!dz || !fi) return;
  ['dragover', 'dragenter'].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('drag'); });
  });

    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('drag'); });
  });
  dz.addEventListener('drop', function (e) {

wires.dash = function () {
  var host = document.getElementById('teamChart');
  if (!host) return;
  var tip = document.getElementById('tscTip');
  var bars = host.querySelectorAll('.tsc-bar');
  function showTip(b) {
    if (!tip) return;
    var h = host.getBoundingClientRect(), r = b.getBoundingClientRect();
    tip.textContent = '';
    var dimEl = document.createElement('b');
    dimEl.textContent = b.getAttribute('data-dim') || '';
    tip.appendChild(dimEl);
    tip.appendChild(document.createTextNode(b.getAttribute('data-tip') || ''));
    tip.hidden = false;
    tip.style.left = (r.left + r.width / 2 - h.left) + 'px';
    tip.style.bottom = (h.bottom - r.top + 8) + 'px';
  }
  function hideTip() { if (tip) tip.hidden = true; }
  Array.prototype.forEach.call(bars, function (b) {
    b.addEventListener('mouseenter', function () { showTip(b); });
    b.addEventListener('mouseleave', hideTip);
    b.addEventListener('focus', function () { showTip(b); });
    b.addEventListener('blur', hideTip);
  });
  /* grow bars from the baseline; guaranteed to settle (rAF + timeout fallback).
     reduced-motion zeroes the transition globally, so bars just appear. */
  function grow() { Array.prototype.forEach.call(bars, function (b) { b.style.height = b.getAttribute('data-h'); }); }
  requestAnimationFrame(function () { requestAnimationFrame(grow); });
  setTimeout(grow, 320);
};

/* ---------- import ---------- */
function applyImport(parsed, name) {
  if (parsed.kind === 'rubric') {
    var rv = Core.validateRubric(parsed.rubric);
    if (rv.length) throw new Error('"' + name + '": that rubric has problems (' + rv[0] + ')');
    var cur = activeRubric();
    var replaceMsg = cur
      ? 'Make "' + parsed.rubric.name + '" your active rubric (replacing "' + cur.name + '" for new ratings)? Existing ratings are kept.'
      : 'Use "' + parsed.rubric.name + '" as your rubric?';
    if (!window.confirm(replaceMsg)) return 'Skipped rubric "' + parsed.rubric.name + '".';
    store.rubrics = store.rubrics.filter(function (x) { return x.id !== parsed.rubric.id; });
    store.rubrics.unshift(parsed.rubric);
    saveRubricFp(parsed.rubric); /* anchor its version to its content as imported */
    persist();
    return 'Rubric "' + parsed.rubric.name + '" is now active.';
  }
  if (parsed.kind === 'survey') {
    var sv = parsed.survey;
    var svv = Core.validateSurvey(sv);
    if (svv.length) throw new Error('"' + name + '": that survey has problems (' + svv[0] + ')');
    store.surveys = store.surveys.filter(function (x) { return x.id !== sv.id; });
    store.surveys.unshift(sv);
    persist();
    return 'Survey "' + sv.name + '" imported.';
  }
  if (parsed.kind === 'surveyResponse') {
    var resp = parsed.response || {};
    var bal = resp.ballot;
    if (!bal || !bal.roundId || !bal.ballotId) throw new Error('"' + name + '" is missing its survey answers.');
    var rid = bal.roundId;
    var rnd = surveyRoundById(rid);
    var sName = rnd ? ((surveyById(rnd.surveyId) || {}).name || 'the survey') : 'the survey';
    if (Core.hasBallot(store.surveyBallots[rid] || [], bal.ballotId)) {
      return 'Looks like you already added this one — skipped it so the counts stay honest.';
    }
    if (resp.receipt) store.surveyReceipts[rid] = Core.addReceipt(store.surveyReceipts[rid] || [], resp.receipt);
    store.surveyBallots[rid] = Core.addBallot(store.surveyBallots[rid] || [], bal);
    persist();
    var n = (store.surveyBallots[rid] || []).length;
    return 'Added a response to "' + sName + '". ' + n + ' in so far.';
  }
  var a = parsed.assessment;
  var foreign = parsed.rubric && !rubricById(parsed.rubric.id) ? parsed.rubric : null;
  if (foreign) {
    var frv = Core.validateRubric(foreign);
    if (frv.length) throw new Error('"' + name + '" carries a damaged rubric (' + frv[0] + ')');
  }
  var rUsed = rubricById(a.rubricId) || (foreign && foreign.id === a.rubricId ? foreign : null);
  if (!rUsed) throw new Error('"' + name + '" was rated against a rubric this Caliber does not have (' + a.rubricId + ').');
  var av = Core.validateAssessmentComplete(a, rUsed);
  if (av.length) throw new Error('"' + name + '" is incomplete: ' + av[0]);
  if (foreign) { store.rubrics.push(foreign); saveRubricFp(foreign); } /* only after everything validates */

function importFiles(fileList) {
  exitDemoForImport();

/* Bake + download with a tripwire: if a browser extension injected external
   references into the live DOM, they'd be baked into the shared file. */
function bakeAndDownload(filename, seed) {
  var out = Core.bakeFile(PRISTINE, seed);
  if (/\b(?:src|href)\s*=\s*["']https?:/i.test(out)) {
    toast('Heads up: a browser extension added content to this page — the saved file may not be fully offline.');
  }
  download(filename, out, 'text/html');
}

      var sent = (store.onboarding && store.onboarding.sent) || {};

        return Core.sendEligible(p, store.rubrics) && !sent[p.firstName.toLowerCase()];
      })[0];
      if (next) { actions.openShare({ first: next.firstName }); return; }
      nav('dash'); return;
    }
    if (c.kind === 'rubric') {
      setEditingRubric(c.rubricId);
      nav('rubric'); return;
    }
    nav(c.go.view, c.go.params);
  },
  /* teammate detail modal (spec §5) — opens from wizard step 4 rows, the Team
     page placeholder rows, and the progress widget's name card */
  tmOpen: function (d) {
    var p = d.first ? findPerson(d.first) : null;
    tmModal = {
      first: p ? p.firstName : null,
      roleId: (p && p.rubricId) || d.rubric || (store.rubrics[0] || {}).id,
      draft: {
        name: p ? p.firstName : '', email: (p && p.email) || '',
        title: (p && p.title) || '', notes: (p && p.notes) || '',
        level: p && p.level != null ? p.level : null
      }
    };
    render();
  },
  tmRole: function (d) {
    tmCapture();
    tmModal.roleId = d.role;
    var role = store.rubrics.filter(function (r) { return r.id === d.role; })[0];
    if (role && tmModal.draft.level != null && tmModal.draft.level > role.levelCount) tmModal.draft.level = null;
    render();
  },
  tmClose: function () { tmModal = null; render(); },
  tmSkip: function () { tmModal = null; render(); },
  tmAdd: function () {
    tmCapture();
    var d = tmModal.draft;
    var name = d.name.trim();
    if (!name) { wizFieldErrs.tmName = 'A name is the one thing this needs.'; render(); return; }
    var existing = tmModal.first ? findPerson(tmModal.first) : null;
    var clash = findPerson(name);
    if (clash && clash !== existing) { wizFieldErrs.tmName = 'Someone named ' + name + ' is already on the team.'; render(); return; }
    if (existing) {
      existing.firstName = name;
      existing.rubricId = tmModal.roleId;
      if (d.level != null) existing.level = d.level; else delete existing.level;
      if (d.email.trim()) existing.email = d.email.trim(); else delete existing.email;
      if (d.title.trim()) existing.title = d.title.trim(); else delete existing.title;
      if (d.notes.trim()) existing.notes = d.notes.trim(); else delete existing.notes;
    } else {
      var rec = { firstName: name, rubricId: tmModal.roleId };
      if (d.level != null) rec.level = d.level;
      if (d.email.trim()) rec.email = d.email.trim();
      if (d.title.trim()) rec.title = d.title.trim();
      if (d.notes.trim()) rec.notes = d.notes.trim();
      store.people.push(rec);
      /* a named person fills one placeholder seat: prefer their role's pool */
      var ph = store.onboarding && store.onboarding.placeholders;
      if (ph) {
        if (ph[tmModal.roleId] > 0) ph[tmModal.roleId]--;
        else { var k = Object.keys(ph).filter(function (id) { return ph[id] > 0; })[0]; if (k) ph[k]--; }
      }
    }
    persist();
    tmModal = null;
    render();
  },
  wizNext: function () {
    var step = parseInt(route.params.step, 10) || 1;
    var commit = [onboardCommitStep1, onboardCommitStep2, onboardCommitStep3, onboardCommitStep4][step - 1];
    if (!commit()) { render(); return; } /* commit fn set wizErr / field errors */
    markStepDone(step);
    if (step < 4) nav('onboard', { step: step + 1 });
    else nav('onboardDone'); /* completion view lands in Task 8 */
  },
  tourNext: function () { demoTourBeat2(); },
  tourSkip: function () { demoTourEnd(); },
  /* completion primary: open the share flow for the first eligible unsent
     person (same pick logic as the setup widget's send card) */
  onboardSendNext: function () {
    var sent = (store.onboarding && store.onboarding.sent) || {};
    var next = store.people.filter(function (p) {
      return Core.sendEligible(p, store.rubrics) && !sent[String(p.firstName).toLowerCase()];
    })[0];
    if (next) { actions.openShare({ first: next.firstName }); return; }
    nav('dash');
  },
  /* onboarding entry (spec §2.3): silent wipe of the demo sample, then the
     wizard. Writing the empty onboarding record IMMEDIATELY is what stops a
     step-1 refresh from counting as "no data at all" and re-entering demo. */
  onboardStart: function () {
    demoTourEnd(); /* the handoff CTA lives inside the tour card */
    Object.keys(LS).forEach(function (k) { lsDel(LS[k]); });
    store.rubrics = []; store.assessments = []; store.people = []; store.managerName = '';
    store.squads = []; store.feedback = {}; store.prep = {}; store.surveys = [];
    store.surveyRounds = []; store.surveyReceipts = {}; store.surveyBallots = {};
    store.profile = { email: '', title: '' };
    store.onboarding = { completedSteps: [], placeholders: {}, sent: {} };
    demoMode = false;
    lsDel(LS.demoMode);
    persist();
    nav('onboard', { step: 1 });
  },
  clearAll: function () {
    if (!window.confirm('Clear ALL Caliber data on this device — people, ratings, rubric edits? Export anything you want to keep first.')) return;
    Object.keys(LS).forEach(function (k) { lsDel(LS[k]); });
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var key = localStorage.key(i);
        if (key && key.indexOf('caliber.') === 0) localStorage.removeItem(key);
      }
    } catch (e) {}
    window.location.reload();
  },
  /* squads */
  squadAdd: function () {
    var el = document.getElementById('newSquad');
    var v = el ? el.value.trim() : '';
    if (!v) { toast('Give the squad a name first.'); return; }
    var squad = { id: Core.uid('sq'), name: v, memberFirstNames: [] };
    store.squads.push(squad);
    editSquadId = squad.id; /* go straight to picking members */
    persist();
    render();
  },
  squadDel: function (d) {
    var squad = store.squads.filter(function (s) { return s.id === d.id; })[0];
    if (!squad) return;
    if (!window.confirm('Delete squad "' + squad.name + '"? People and their ratings stay.')) return;
    store.squads = store.squads.filter(function (s) { return s.id !== d.id; });
    if (editSquadId === d.id) editSquadId = null;
    persist();
    render();
  },
  squadEdit: function (d) {
    editSquadId = editSquadId === d.id ? null : d.id;
    render();
  },
  /* feedback */
  fbAdd: function (d) {
    var el = document.getElementById('fbText');
    var v = el ? el.value.trim() : '';
    if (!v) { toast('Jot something down first.'); return; }
    var k = d.first.toLowerCase();
    if (!store.feedback[k]) store.feedback[k] = [];
    store.feedback[k].unshift({ id: Core.uid('fb'), date: Core.todayISO(), text: v });
    persist();
    render();
  },
  fbDel: function (d) {
    if (!window.confirm('Delete this note?')) return;
    var k = d.first.toLowerCase();
    store.feedback[k] = (store.feedback[k] || []).filter(function (n) { return n.id !== d.id; });
    if (!store.feedback[k].length) delete store.feedback[k];
    persist();
    render();
  },
  /* 1:1 prep (Claude-assisted, copy-prompt pattern) */
  copyPrepPrompt: function (d) { copyText(buildPrepPrompt(d.first), 'Prompt copied — paste it into your Claude.'); },
  savePrep: function (d) {
    var el = document.getElementById('prepPaste');
    var v = el ? el.value.trim() : '';
    if (!v) { toast('Paste Claude’s prep first — then it sticks.'); return; }
    var k = d.first.toLowerCase();
    if (!store.prep[k]) store.prep[k] = [];
    store.prep[k].unshift({ id: Core.uid('prep'), date: Core.todayISO(), text: v });
    persist();
    toast('1:1 prep saved on ' + d.first + '.');
    render();
  },
  prepDel: function (d) {
    var k = d.first.toLowerCase();
    store.prep[k] = (store.prep[k] || []).filter(function (n) { return n.id !== d.id; });
    if (!store.prep[k].length) delete store.prep[k];
    persist();
    render();
  },
  focusDim: function (d) {
    var card = document.getElementById('focus-' + d.dim);
    if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    var det = document.getElementById('aligned-details');
    if (det) { det.open = true; det.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  },
  /* IC */
  icStart: function () {
    beginRating({ rubric: SEED.rubric, firstName: SEED.request.subject.firstName, raterType: 'self', mode: 'share' });
  },
  icDownload: function () {
    var doneMap = lsGet(LS.shareDone, {});
    var a = doneMap[SEED.request.shareId];
    if (!a) { toast('No finished answers found.'); return; }
    var seed = { mode: 'share', rubric: SEED.rubric, request: SEED.request, completedAssessment: a };
    bakeAndDownload(Core.safeFileName(SEED.request.subject.firstName) + '-self-assessment-' + a.date + '.html', seed);
    nav('icDone', { downloaded: true });
  },
  icCopy: function () {
    var doneMap = lsGet(LS.shareDone, {});
    var a = doneMap[SEED.request.shareId];
    if (!a) { toast('No finished answers found.'); return; }
    copyText(exportPayload(a), 'Copied — paste it in a message to ' + (SEED.request.managerName || 'your manager') + '.');
  },
  copyReturned: function () {
    copyText(exportPayload(SEED.completedAssessment), "Copied — paste it into Caliber's Data screen.");
  }
};

var persistTimer = null;
function persistSoon() {
  var s = document.getElementById('saveStatus');
  if (s) s.textContent = 'Saving…';
  if (persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(function () {
    persist();
    var s2 = document.getElementById('saveStatus');
    if (s2) s2.textContent = savedLabel();
  }, 500);
}
appEl.addEventListener('input', function (e) {
  var t = e.target.closest('[data-edit]');
  if (!t) return;
  var r = editingRubric();
  var kind = t.dataset.edit;
  if (kind === 'note') { setNote(curDim().id, t.value); return; }
  if (!r) return;
  var di = parseInt(t.dataset.dim || '-1', 10);
  var li = parseInt(t.dataset.level || '-1', 10);
  if (kind === 'rubricName') r.name = t.value;
  else if (kind === 'dimName' && r.dimensions[di]) r.dimensions[di].name = t.value;
  else if (kind === 'dimDesc' && r.dimensions[di]) r.dimensions[di].description = t.value;
  else if (kind === 'dimNotePrompt' && r.dimensions[di]) {
    /* keep the record clean: blank input removes the key (renderer falls back) */
    if (t.value.trim()) r.dimensions[di].notePrompt = t.value.trim();
    else delete r.dimensions[di].notePrompt;
  }
  else if (kind === 'lvlLabel' && r.dimensions[di] && r.dimensions[di].levels[li]) r.dimensions[di].levels[li].label = t.value;
  else if (kind === 'lvlDesc' && r.dimensions[di] && r.dimensions[di].levels[li]) r.dimensions[di].levels[li].descriptor = t.value;
  persistSoon();
  refreshFixbar(); /* live-update the floating to-do bar as blanks get filled */
});

/* ================= Caliber Pulse — survey UI ================= */
var surveyDraft = null;      /* the survey being composed/edited */
var pulseRound = {};         /* surveyId -> roundId selected on the results screen */
var lastSurveyResp = null;   /* responder: last baked file, for "download again" */

function surveyById(id) { for (var i = 0; i < store.surveys.length; i++) if (store.surveys[i].id === id) return store.surveys[i]; return null; }
function surveyRoundById(id) { for (var i = 0; i < store.surveyRounds.length; i++) if (store.surveyRounds[i].id === id) return store.surveyRounds[i]; return null; }
function roundsForSurvey(sid) { return store.surveyRounds.filter(function (r) { return r.surveyId === sid; }); }
function latestRound(sid) { var rs = roundsForSurvey(sid); return rs.length ? rs[rs.length - 1] : null; }
function ballotsFor(rid) { return store.surveyBallots[rid] || []; }
function receiptsFor(rid) { return store.surveyReceipts[rid] || []; }

/* The prompt a manager copies into their own Claude to draft questions.
   Mirrors buildAuthoringPrompt: native tappable picker, NOT a form artifact. */
function buildSurveyPrompt() {
  var cats = SURVEY_BANK.categories.map(function (c) { return c.name; }).join(', ');
  return [
    'I am a manager building a short, anonymous team-sentiment "pulse" survey (like Glint or a Best-Places-to-Work survey). Help me write the questions.',
    '',
    'First, ask me a few quick questions to tailor it. Present them as tappable multiple-choice using your built-in question UI — NOT a form artifact, NOT code. A few at a time. Cover: what I most want to learn right now, which themes matter most, my team size, and the tone I want.',
    '',
    'Themes you can draw from: ' + cats + '.',
    '',
    'Then output the survey as JSON, both as a downloadable file AND in a ```json code block, in exactly this shape:',
    '{ "survey": { "name": "<short name>", "categories": [ { "id": "cat_x", "name": "<theme>" } ], "questions": [ { "id": "q_1", "categoryId": "cat_x", "type": "scale", "text": "<agreement statement>", "scale": { "min": 1, "max": 5, "minLabel": "Strongly disagree", "maxLabel": "Strongly agree" } }, { "id": "q_2", "categoryId": "cat_x", "type": "text", "text": "<open question>" } ] } }',
    '',
    'Rules: scale questions are 5-point agreement statements. Keep it to 6-12 questions total. Plain language. Every question needs a unique id and a categoryId that matches a category above.'
  ].join('\n');
}

function captureSurveyName() { if (!surveyDraft) return; var el = document.getElementById('surveyName'); if (el) surveyDraft.name = el.value; }

/* ---- hub ---- */
views.pulse = function () {
  var rows = store.surveys.map(function (s) {
    var lr = latestRound(s.id);

      '<p class="small muted" style="margin:var(--sp-1) 0 0">' + (s.questions || []).length + ' questions · ' + meta + '</p></div>' +
      '<div class="row">' +
      (lr ? '<button class="btn" data-action="surveyResults" data-id="' + esc(s.id) + '">Results</button>' : '') +
      '<button class="btn" data-action="surveySend" data-id="' + esc(s.id) + '">Send</button>' +
      '<button class="btn btn--ghost" data-action="surveyEdit" data-id="' + esc(s.id) + '">Edit</button>' +
      '</div></div></div>';
  }).join('');
  var body = store.surveys.length ? rows : '<div class="empty"><h2>No pulse surveys yet</h2><p>A pulse is a short, anonymous read on how the team is feeling. Pick a few questions, send it out, and see the mood in aggregate.</p></div>';
  return '<div class="shell">' + topbar('pulse') +
    '<h1>Team pulse</h1><p class="lede">Short, anonymous sentiment checks. You see the team mood in aggregate, never who said what.</p>' +
    '<div class="row" style="margin-bottom:var(--sp-5)"><button class="btn btn--primary" data-action="surveyStartNew">New survey</button></div>' +

/* ---- composer (new + edit share one view) ---- */

  var bankHtml = SURVEY_BANK.categories.map(function (c) {
    var qs = SURVEY_BANK.questions.filter(function (q) { return q.categoryId === c.id; }).map(function (q) {
      var on = inDraft[q.id];
      return '<label class="level-option' + (on ? ' level-option--selected' : '') + '" style="display:flex;gap:var(--sp-2);align-items:flex-start;margin-bottom:var(--sp-2)">' +

        '<span>' + (q.type === 'text' ? '✎ ' : '') + esc(q.text) + (q.source ? ' <span class="small muted">(' + esc(q.source) + ')</span>' : '') + '</span></label>';
    }).join('');

  }).join('') + '</div>' : '';

  return '<div class="shell">' + topbar('pulse') +
    '<h1>' + (isEdit ? 'Edit survey' : 'New pulse survey') + '</h1>' +
    '<p class="lede">Pick questions from the bank or add your own. ' + d.questions.length + ' selected.</p>' +
    '<label class="field"><span>Survey name</span><input id="surveyName" class="input" value="' + esc(d.name || '') + '" placeholder="e.g. Q3 Team Pulse"></label>' +
    '<div class="card" style="margin:var(--sp-4) 0"><h3 style="margin:0 0 var(--sp-2)">Add a custom question</h3>' +
      '<div class="row"><select id="customType" class="input" style="width:auto"><option value="scale">Agreement scale (1-5)</option><option value="text">Open text</option></select>' +
      '<input id="customText" class="input" placeholder="Type your question…" style="flex:1"></div>' +
      '<button class="btn" style="margin-top:var(--sp-2)" data-action="surveyAddCustom">Add question</button></div>' +
    customList +
    '<h2>Question bank</h2><p class="small muted">Drawn from public engagement surveys (US FEVS, UK Civil Service People Survey) and reworded frameworks. Tick to include.</p>' + bankHtml +
    '<div class="row" style="margin-top:var(--sp-4)"><button class="btn btn--primary" data-action="surveySave">Save survey</button>' +
    '<button class="btn btn--ghost" data-action="go" data-view="pulse">Cancel</button></div>' +
    '<hr class="divider"><h2>Draft with Claude</h2><p class="small muted">No API key. Copy this into your own Claude; it asks a few tappable questions, then hands back questions to paste below.</p>' +
    '<pre id="surveyPrompt" style="' + preStyle + '">' + esc(buildSurveyPrompt()) + '</pre>' +

    '<button class="btn" data-action="surveyAdoptClaude">Add those questions</button></div>';

views.surveyNew = function () { return surveyComposeView(false); };
views.surveyEdit = function () { return surveyComposeView(true); };

/* ---- send ---- */
views.surveySend = function () {
  var s = surveyById(route.params.id);
  if (!s) return '<div class="shell">' + topbar('pulse') + '<div class="empty">Survey not found. <button class="btn" data-action="go" data-view="pulse">Back</button></div></div>';

  }).join('') : '<div class="empty">Add team members on the Team screen first, then come back to send.</div>';

    '<label class="row small muted" style="margin:var(--sp-3) 0;gap:var(--sp-2)"><input type="checkbox" id="anonMode"> Anonymous mode: one un-named file, stronger privacy, but no “who has replied” tracking.</label>' +
    '<div class="row"><button class="btn btn--primary" data-action="surveyDoSend" data-id="' + esc(s.id) + '">Download the files</button><button class="btn btn--ghost" data-action="go" data-view="pulse">Cancel</button></div>' +
    '<p class="small muted" style="margin-top:var(--sp-3)">Your browser may ask to allow multiple downloads — that is one file per person.</p></div>';

/* ---- results ---- */
views.surveyResults = function () {
  var s = surveyById(route.params.id);
  if (!s) return '<div class="shell">' + topbar('pulse') + '<div class="empty">Survey not found. <button class="btn" data-action="go" data-view="pulse">Back</button></div></div>';
  var rounds = roundsForSurvey(s.id);
  if (!rounds.length) return '<div class="shell">' + topbar('pulse') + '<h1>' + esc(s.name) + '</h1><div class="empty">No rounds sent yet.</div></div>';
  var round = surveyRoundById(pulseRound[s.id]) || rounds[rounds.length - 1];
  var ballots = ballotsFor(round.id);
  var agg = Core.surveyAggregate(s, ballots, { minN: 3, textFloor: 5 });
  var completion;
  if (round.roster && round.roster.length) {
    var c = Core.surveyCompletion(round.roster, receiptsFor(round.id));
    completion = '<p class="lede">' + c.responded + ' of ' + c.total + ' replied (' + c.pct + '%).</p>';
  } else {
    completion = '<p class="lede">Anonymous round — ' + agg.count + ' response' + (agg.count === 1 ? '' : 's') + ' in.</p>';
  }
  var roundSel = rounds.length > 1 ? '<label class="row small muted" style="margin-bottom:var(--sp-3);gap:var(--sp-2)">Round <select id="roundSel" class="input" style="width:auto">' +
    rounds.map(function (r) { return '<option value="' + esc(r.id) + '"' + (r.id === round.id ? ' selected' : '') + '>' + esc(r.openedDate) + (r.roster && r.roster.length ? '' : ' (anonymous)') + '</option>'; }).join('') + '</select></label>' : '';
  var qhtml = agg.questions.map(function (q) {
    if (q.type === 'scale') {
      if (q.gated) return '<div class="card" style="margin-bottom:var(--sp-3)"><b>' + esc(q.text) + '</b><p class="small muted">Need at least ' + agg.minN + ' responses to show this.</p></div>';
      var mid = (q.scale.min + q.scale.max) / 2, bars = '';
      for (var lv = q.scale.min; lv <= q.scale.max; lv++) {
        var nn = q.distribution[lv] || 0, pct = q.answered ? Math.round(nn / q.answered * 100) : 0;
        bars += '<div class="row" style="gap:var(--sp-2);align-items:center;margin-bottom:2px"><span class="small muted" style="width:1.4em">' + lv + '</span>' +
          '<span style="display:inline-block;height:10px;width:' + pct + '%;min-width:' + (nn ? '4px' : '0') + ';background:' + (lv > mid ? 'var(--c-accent)' : 'var(--c-line)') + ';border-radius:var(--r-pill)"></span><span class="small muted">' + nn + '</span></div>';
      }
      return '<div class="card" style="margin-bottom:var(--sp-3)"><div class="row row--between"><b>' + esc(q.text) + '</b><span class="tag tag--on">' + q.favorablePct + '% favorable</span></div>' +
        '<p class="small muted" style="margin:var(--sp-1) 0 var(--sp-2)">avg ' + (q.avg ? q.avg.toFixed(1) : '–') + ' · ' + q.answered + ' answered</p>' + bars + '</div>';
    }
    if (q.gated) return '<div class="card" style="margin-bottom:var(--sp-3)"><b>' + esc(q.text) + '</b><p class="small muted">Open-text answers appear once ' + agg.textFloor + ' people have replied.</p></div>';
    var items = (q.texts || []).map(function (tx) { return '<li>' + esc(tx) + '</li>'; }).join('');
    return '<div class="card" style="margin-bottom:var(--sp-3)"><b>' + esc(q.text) + '</b><ul>' + (items || '<li class="muted">No written answers.</li>') + '</ul></div>';
  }).join('');
  return '<div class="shell">' + topbar('pulse') +
    '<h1>' + esc(s.name) + '</h1>' + completion + roundSel +
    '<p class="small muted">Answers are pooled and unattributed. On a small team, open-text and a near-complete roster can still hint at who — the anonymous-file option is stronger.</p>' +
    qhtml +
    '<div class="row" style="margin-top:var(--sp-4)"><button class="btn btn--ghost" data-action="go" data-view="pulse">← Back to pulse</button></div></div>';
};
wires.surveyResults = function () {
  var sel = document.getElementById('roundSel');
  if (sel) sel.addEventListener('change', function () { pulseRound[route.params.id] = sel.value; render(); });
};

/* ---- responder (survey-mode baked file) ---- */
views.surveyRespond = function () {
  var s = SEED.survey;
  if (!s) return '<div class="shell shell--narrow"><div class="empty"><h2>This survey file looks damaged</h2><p>Ask for a fresh copy.</p></div></div>';
  var qhtml = (s.questions || []).map(function (q) {
    if (q.type === 'text') {
      return '<div class="card" style="margin-bottom:var(--sp-3)"><label class="field"><span>' + esc(q.text) + '</span><textarea class="input respText" data-qid="' + esc(q.id) + '" placeholder="Optional"></textarea></label></div>';
    }
    var opts = '';
    for (var lv = q.scale.min; lv <= q.scale.max; lv++) opts += '<label class="level-option" style="text-align:center;flex:1"><input type="radio" name="qr_' + esc(q.id) + '" value="' + lv + '"> ' + lv + '</label>';
    return '<div class="card" style="margin-bottom:var(--sp-3)"><b>' + esc(q.text) + '</b><div class="row" style="margin-top:var(--sp-2);gap:var(--sp-2)">' + opts + '</div>' +
      '<div class="row row--between small muted"><span>' + esc(q.scale.minLabel) + '</span><span>' + esc(q.scale.maxLabel) + '</span></div></div>';
  }).join('');
  return '<div class="shell shell--narrow"><h1>' + esc(s.name) + '</h1>' +
    '<p class="lede">Your answers are pooled with the rest of the team. Your manager sees the overall picture, not who said what.</p>' +
    qhtml +
    '<button class="btn btn--primary" data-action="surveyRespondSubmit">Finish</button>' +
    '<p class="small muted" style="margin-top:var(--sp-3)">This downloads a small file. Send it back to your manager.</p></div>';
};
views.surveyRespondDone = function () {
  return '<div class="shell shell--narrow"><div class="empty"><h2>Thanks — that is done</h2><p>Your answers file has downloaded. Send it back to your manager, then you can close this page.</p>' +
    '<button class="btn" data-action="surveyRespondAgain">Download again</button></div></div>';
};

/* ---- actions ---- */
actions.surveyStartNew = function () {
  surveyDraft = { id: Core.uid('srv'), name: '', version: 1, createdDate: Core.todayISO(), categories: JSON.parse(JSON.stringify(SURVEY_BANK.categories)), questions: [] };
  nav('surveyNew');
};
actions.surveyEdit = function (d) {
  var s = surveyById(d.id); if (!s) { toast('Survey not found'); return; }
  surveyDraft = JSON.parse(JSON.stringify(s));
  if (!surveyDraft.categories || !surveyDraft.categories.length) surveyDraft.categories = JSON.parse(JSON.stringify(SURVEY_BANK.categories));
  nav('surveyEdit');
};
actions.surveyToggleBank = function (d) {
  captureSurveyName();
  var ids = surveyDraft.questions.map(function (q) { return q.id; }), i = ids.indexOf(d.qid);
  if (i >= 0) surveyDraft.questions.splice(i, 1);
  else { var bq = null; SURVEY_BANK.questions.forEach(function (q) { if (q.id === d.qid) bq = q; }); if (bq) surveyDraft.questions.push(JSON.parse(JSON.stringify(bq))); }
  render();
};
actions.surveyAddCustom = function () {
  captureSurveyName();
  var t = document.getElementById('customText'), ty = document.getElementById('customType');
  var text = t ? t.value.trim() : '';
  if (!text) { toast('Type the question first'); return; }
  var q = { id: Core.uid('q'), categoryId: '', type: (ty && ty.value === 'text') ? 'text' : 'scale', text: text, source: 'Custom' };
  if (q.type === 'scale') q.scale = { min: 1, max: 5, minLabel: 'Strongly disagree', maxLabel: 'Strongly agree' };
  surveyDraft.questions.push(q);
  render();
};
actions.surveyRemoveQ = function (d) { captureSurveyName(); surveyDraft.questions = surveyDraft.questions.filter(function (q) { return q.id !== d.qid; }); render(); };
actions.surveySave = function () {
  captureSurveyName();
  var errs = Core.validateSurvey(surveyDraft);
  if (errs.length) { showDialog({ title: 'A couple of gaps to fix', bodyHtml: '<ul>' + errs.slice(0, 4).map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>', actions: [{ label: 'OK', primary: true }] }); return; }
  store.surveys = store.surveys.filter(function (x) { return x.id !== surveyDraft.id; });
  store.surveys.unshift(surveyDraft);
  persist();
  toast('Survey saved');
  nav('pulse');
};
actions.copySurveyPrompt = function () { copyText(buildSurveyPrompt(), 'Prompt copied'); };
actions.surveyAdoptClaude = function () {
  captureSurveyName();
  var el = document.getElementById('surveyPaste'), txt = el ? el.value : '';
  try {
    var parsed = Core.parseImport(txt, 'pasted survey');
    if (parsed.kind !== 'survey') throw new Error('That did not look like survey questions.');
    var got = parsed.survey.questions || [], have = {};
    surveyDraft.questions.forEach(function (q) { have[q.id] = true; });
    var added = 0;
    got.forEach(function (q) {
      if (!q || !q.text) return;
      if (!q.id || have[q.id]) q.id = Core.uid('q');
      if (q.type !== 'scale' && q.type !== 'text') q.type = 'scale';
      if (q.type === 'scale' && !q.scale) q.scale = { min: 1, max: 5, minLabel: 'Strongly disagree', maxLabel: 'Strongly agree' };
      q.categoryId = ''; /* drop Claude's categories so it lands under custom and always validates */
      surveyDraft.questions.push(q); have[q.id] = true; added++;
    });
    toast('Added ' + added + ' question' + (added === 1 ? '' : 's'));
    render();
  } catch (e) { showDialog({ title: 'Could not read that', bodyHtml: esc(e.message), actions: [{ label: 'OK', primary: true }] }); }
};
actions.surveySend = function (d) { nav('surveySend', { id: d.id }); };
actions.surveyResults = function (d) { nav('surveyResults', { id: d.id }); };
actions.surveyDoSend = function (d) {
  var s = surveyById(d.id); if (!s) return;
  var anon = document.getElementById('anonMode'), isAnon = anon && anon.checked;
  var round = { id: Core.uid('rnd'), surveyId: s.id, surveyVersion: s.version || 1, openedDate: Core.todayISO(), closedDate: null, roster: [] };
  if (isAnon) {
    store.surveyRounds.push(round); persist();
    bakeAndDownload('caliber-pulse-' + Core.safeFileName(s.name) + '.html', Core.buildSurveyShareSeed(s, round, null));
    toast('Anonymous survey file downloaded'); nav('pulse'); return;
  }
  var picks = Array.prototype.slice.call(document.querySelectorAll('.sendPick')).filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
  if (!picks.length) { toast('Pick at least one person'); return; }
  round.roster = picks.map(function (name) { return { responderId: Core.uid('rsp'), label: name }; });
  store.surveyRounds.push(round); persist();
  round.roster.forEach(function (rcpt) {
    bakeAndDownload('caliber-pulse-' + Core.safeFileName(s.name) + '-' + Core.safeFileName(rcpt.label) + '.html', Core.buildSurveyShareSeed(s, round, rcpt));
  });
  toast(picks.length + ' file' + (picks.length === 1 ? '' : 's') + ' downloaded'); nav('pulse');
};
actions.surveyRespondSubmit = function () {
  var s = SEED.survey, answers = [];
  (s.questions || []).forEach(function (q) {
    if (q.type === 'text') { var ta = document.querySelector('.respText[data-qid="' + q.id + '"]'); var v = ta ? ta.value.trim() : ''; if (v) answers.push({ questionId: q.id, text: v }); }
    else { var sel = document.querySelector('input[name="qr_' + q.id + '"]:checked'); if (sel) answers.push({ questionId: q.id, value: parseInt(sel.value, 10) }); }
  });
  var rid = (SEED.round && SEED.round.id) || '';
  var cr = {
    receipt: SEED.recipient ? { roundId: rid, responderId: SEED.recipient.responderId, label: SEED.recipient.label, respondedAt: Core.todayISO() } : null,
    ballot: { ballotId: Core.uid('bal'), roundId: rid, answers: answers }
  };
  var seed = Object.assign({}, SEED, { completedResponse: cr });
  var fname = (SEED.recipient && SEED.recipient.label) ? (Core.safeFileName(SEED.recipient.label) + '-pulse.html') : 'pulse-response.html';
  bakeAndDownload(fname, seed);
  lastSurveyResp = { fname: fname, seed: seed };
  var done = lsGet('caliber.surveyDone', {}); done[rid] = true; lsSet('caliber.surveyDone', done);
  nav('surveyRespondDone');
};
actions.surveyRespondAgain = function () { if (lastSurveyResp) bakeAndDownload(lastSurveyResp.fname, lastSurveyResp.seed); };

/* ---------- demo mode (spec §2) ----------
   First run = no user data at all. Seed the sample crew so the first thing a
   new manager sees is the END STATE, not an empty app. The wizard writing
   store.onboarding on open is what makes this unrepeatable (§3.3). */
function isFirstRun() {
  return !store.people.length && !store.assessments.length &&
    !store.managerName && !store.onboarding && !lsGet(LS.demoMode, false);
}
/* share/survey files share the file:// storage origin with the manager's own
   data — a stale demoMode flag must never paint demo chrome on an IC's file */
var demoMode = !SHARED_FILE && lsGet(LS.demoMode, false);
if (!SHARED_FILE && isFirstRun()) {
  var seedR = store.rubrics[0] || templateList()[0];
  if (!store.rubrics.length) store.rubrics.push(seedR);
  var demoData = Core.buildDemoData(seedR);
  store.people = demoData.people;
  store.assessments = demoData.assessments;
  demoMode = true;
  lsSet(LS.demoMode, true);
  persist();
}

/* ---------- boot ---------- */
if (SEED.mode === 'survey' && SEED.survey) {
  var sdone = lsGet('caliber.surveyDone', {});
  nav((SEED.round && sdone[SEED.round.id]) ? 'surveyRespondDone' : 'surveyRespond');
} else if (SEED.mode === 'share' && SEED.request) {
  if (SEED.completedAssessment) nav('returnedFile');
  else {
    var doneMap = lsGet(LS.shareDone, {});
    nav(doneMap[SEED.request.shareId] ? 'icDone' : 'icIntro');
  }
} else {
  /* catches "edited the rubric, then closed the tab" — the content change
     persisted but the version bump was lost until now */
  syncRubricVersion();
  /* return a returning manager to the tab they were on (test feedback B2);
     demo mode lands on the populated dash (the point is seeing the end state);
     other first-timers get the role picker */
  var savedView = lsGet(LS.view, null);
  if (demoMode) nav(RESTORABLE.indexOf(savedView) !== -1 ? savedView : 'dash');
  else nav(RESTORABLE.indexOf(savedView) !== -1 ? savedView : 'home');
  if (demoMode && !lsGet(LS.demoTourShown, false)) {
    lsSet(LS.demoTourShown, true); /* set immediately — the tour shows once, ever */
    showDemoTour();
  }
}
})();
</script>
